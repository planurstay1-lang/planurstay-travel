<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flights — PlanurStay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://payment-wrapper.liteapi.travel/dist/liteAPIPayment.js?v=a1"></script>
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="/" class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16v-2a5 5 0 0 0-5-5H9a5 5 0 0 0-5 5v2"/><polyline points="21 12 12 8 3 12"/><polyline points="19 18 12 14 5 18"/><circle cx="12" cy="14" r="2" fill="currentColor" stroke="none"/></svg>
        PlanurStay
      </a>
      <nav class="nav-tabs">
        <a href="/hotels" class="nav-tab hotel-tab" id="navHotelsTab">🏨 Hotels</a>
        <a href="/flights" class="nav-tab flight-tab active" id="navFlightsTab">✈️ Flights</a>
      </nav>
      <div class="header-actions">
        <a href="/my-bookings" class="btn-ghost" id="myBookingsBtn">My Bookings</a>
        <a href="/login" class="btn-ghost" id="signInBtn">Sign In</a>
      </div>
    </div>
  </header>

  <main class="results-page">
    <div class="container">

      <div class="results-top">
        <a href="/" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          Back to home
        </a>
        <h1 class="results-title">Flight Results</h1>
      </div>

      <!-- Filters bar -->
      <div class="results-filters" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:12px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border)">
        <div class="filter-group" style="display:flex;gap:8px;align-items:center">
          <label style="font-size:13px;color:var(--text-secondary);white-space:nowrap">🛑 Stops:</label>
          <select id="filterStops" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--background);color:var(--foreground);cursor:pointer">
            <option value="">Any stops</option>
            <option value="0">Nonstop only</option>
            <option value="1">1 stop max</option>
            <option value="2">2 stops max</option>
          </select>
        </div>

        <div class="filter-group" style="display:flex;gap:8px;align-items:center">
          <label style="font-size:13px;color:var(--text-secondary);white-space:nowrap">💺 Cabin:</label>
          <select id="filterCabin" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--background);color:var(--foreground);cursor:pointer">
            <option value="">Any cabin</option>
            <option value="economy">Economy</option>
            <option value="premium">Premium Economy</option>
            <option value="business">Business</option>
            <option value="first">First Class</option>
          </select>
        </div>

        <div class="filter-group" style="display:flex;gap:8px;align-items:center">
          <label style="font-size:13px;color:var(--text-secondary);white-space:nowrap">💰 Max price:</label>
          <select id="filterMaxPrice" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--background);color:var(--foreground);cursor:pointer">
            <option value="">Any price</option>
            <option value="200">Under $200</option>
            <option value="400">Under $400</option>
            <option value="600">Under $600</option>
            <option value="800">Under $800</option>
            <option value="1000">Under $1000</option>
            <option value="1500">Under $1500</option>
            <option value="2000">Under $2000</option>
          </select>
        </div>

        <div class="filter-group" style="display:flex;gap:8px;align-items:center">
          <label style="font-size:13px;color:var(--text-secondary);white-space:nowrap">🕐 Depart:</label>
          <select id="filterDepartTime" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--background);color:var(--foreground);cursor:pointer">
            <option value="">Any time</option>
            <option value="morning">Morning (6am–12pm)</option>
            <option value="afternoon">Afternoon (12pm–6pm)</option>
            <option value="evening">Evening (6pm–12am)</option>
            <option value="night">Night (12am–6am)</option>
          </select>
        </div>

        <div style="margin-left:auto">
          <button id="clearFilters" style="font-size:12px;color:var(--primary);background:none;border:none;cursor:pointer;padding:4px 8px">Clear filters</button>
        </div>
      </div>

      <div id="loader" class="loading-text" style="display:none">
        <span class="spinner"></span> Searching flights...
      </div>

      <div id="noResults" class="empty-state" style="display:none">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <h3>No flights found</h3>
        <p>Try different airports, dates, or a one-way search.</p>
        <a href="/" class="btn-primary">Search again</a>
      </div>

      <div id="flightResults"></div>

    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <span>© 2026 PlanurStay. All rights reserved.</span>
        <span>Powered by LiteAPI</span>
      </div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/flight-results.js"></script>

</body>
</html>
