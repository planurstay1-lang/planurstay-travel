<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — PlanurStay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/ps.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-art" style="background-image:url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1400&q=70')">
      <h2>Member prices on hotels worldwide.</h2>
      <p>Sign in to see lower rates, earn points on every stay and keep all your trips in one place.</p>
    </div>
    <div class="auth-form">
      <div class="auth-card">
        <h1 id="authTitle">Welcome back</h1>
        <p id="authSub">Sign in to unlock member prices.</p>
        <div class="seg" role="tablist">
          <button type="button" data-mode="login" class="active" role="tab">Sign in</button>
          <button type="button" data-mode="signup" role="tab">Create account</button>
        </div>
        <div id="authMsg"></div>
        <form id="authForm" novalidate>
          <div class="field" style="margin-bottom:14px"><label for="email">Email</label><input type="email" id="email" autocomplete="email" required placeholder="you@example.com"></div>
          <div class="field" style="margin-bottom:18px"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters"></div>
          <button class="btn btn-primary btn-lg btn-block" id="submitBtn" type="submit">Sign in</button>
        </form>
        <p class="price-sub" style="text-align:center;margin-top:16px">By continuing you agree to PlanurStay's terms and privacy policy.</p>
      </div>
    </div>
  </div>

  <script src="/js/ps.js"></script>
  <script>
  (function () {
    PS.header({});
    const q = PS.qs();
    // Only allow same-site relative redirects.
    const redirect = q.redirect && q.redirect.startsWith("/") && !q.redirect.startsWith("//") ? q.redirect : "/";
    let mode = q.mode === "signup" ? "signup" : "login";
    const form = document.getElementById("authForm"), btn = document.getElementById("submitBtn"), msg = document.getElementById("authMsg");
    const pw = document.getElementById("password");

    function setMode(m) {
      mode = m;
      document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("active", b.dataset.mode === m));
      document.getElementById("authTitle").textContent = m === "signup" ? "Create your account" : "Welcome back";
      document.getElementById("authSub").textContent = m === "signup" ? "Free to join. Start saving on your next stay." : "Sign in to unlock member prices.";
      btn.textContent = m === "signup" ? "Create account" : "Sign in";
      pw.autocomplete = m === "signup" ? "new-password" : "current-password";
      msg.innerHTML = "";
    }
    document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
    setMode(mode);

    PS.auth().then(a => { if (a.loggedIn) location.replace(redirect); });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.innerHTML = "";
      const email = document.getElementById("email").value.trim(), password = pw.value;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.innerHTML = `<div class="alert error" style="margin-bottom:14px">${PS.icon("alert", 18)}<div>Enter a valid email address.</div></div>`; return; }
      if (password.length < 6) { msg.innerHTML = `<div class="alert error" style="margin-bottom:14px">${PS.icon("alert", 18)}<div>Password must be at least 6 characters.</div></div>`; return; }
      btn.disabled = true; btn.textContent = mode === "signup" ? "Creating account…" : "Signing in…";
      try {
        await PS.api(mode === "signup" ? "/api/auth/signup" : "/api/auth/login", { method: "POST", body: { email, password } });
        if (mode === "signup") PS.track("signup", {});
        location.replace(redirect);
      } catch (err) {
        btn.disabled = false; btn.textContent = mode === "signup" ? "Create account" : "Sign in";
        const already = /already registered/i.test(err.message);
        msg.innerHTML = `<div class="alert error" style="margin-bottom:14px">${PS.icon("alert", 18)}<div>${PS.esc(err.message)}${already ? ` <button type="button" class="link" style="background:none;border:0;padding:0" id="toLogin">Sign in instead</button>` : ""}</div></div>`;
        document.getElementById("toLogin")?.addEventListener("click", () => setMode("login"));
      }
    });
  })();
  </script>
</body>
</html>
