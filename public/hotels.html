<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotels — PlanurStay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/ps.css">
</head>
<body>
  <div class="searchbar-wrap"><div class="container"><div class="search-card" id="searchHost"></div></div></div>

  <main class="container">
    <div class="results-layout" id="layout">
      <aside class="filters" id="filters" aria-label="Filters">
        <div class="filters-mobile-head"><h3>Filters</h3><button class="btn btn-sm btn-ghost" id="closeFilters">Close</button></div>
        <div class="f-group" id="miniMapGroup" style="padding-top:14px">
          <button type="button" class="mini-map" id="miniMapBtn" aria-label="Show hotels on a map">
            <div id="miniMap"></div>
            <span class="btn btn-sm btn-primary mini-map-cta">Show map</span>
          </button>
        </div>
        <div class="fbox">
          <div class="fbox-head"><h3>Filters</h3><button type="button" class="link-btn" id="clearFilters">Clear filters</button></div>
          <div class="f-group">
            <h4>Property name</h4>
            <div class="field f-search"><span class="f-search-ic" aria-hidden="true"></span><input type="search" id="fName" placeholder="e.g. Hilton, Marriott, Ritz" aria-label="Property name"></div>
          </div>
          <div class="f-group" id="fPriceGroup">
            <h4>Price per night <span class="f-val" id="fPriceMax">Any</span></h4>
            <input type="range" class="range" id="fPrice" min="0" max="100" value="100" aria-label="Maximum price per night">
            <div class="range-vals"><span id="fPriceMin">$0</span><span id="fPriceTop"></span></div>
          </div>
          <div id="fDynA"></div>
          <div class="f-group f-landmark">
            <h4>Distance</h4>
            <div class="field f-search lm-field"><span class="f-search-ic" aria-hidden="true"></span><input type="search" id="fLandmark" placeholder="Landmark, address or station" aria-label="Distance from a landmark" autocomplete="off"></div>
            <div class="pill-row lm-sugg" id="lmSugg"></div>
            <div class="lm-active hidden" id="lmActive"></div>
            <div class="time-label" id="fDistLabel"></div>
            <div class="pill-row" id="fDist"></div>
          </div>
          <div id="fDynB"></div>
        </div>
        <div class="f-group show-mobile" style="display:none"><button class="btn btn-primary btn-block" id="applyFilters">Show results</button></div>
      </aside>

      <section id="listCol">
        <div class="res-toolbar">
          <div class="res-title"><h1 id="resTitle">Hotels</h1><p id="resMeta">Searching live prices…</p></div>
          <div class="res-actions">
            <button class="btn btn-sm btn-ghost show-mobile" id="openFilters"></button>
            <button class="btn btn-sm btn-ghost hidden" id="alertBtn"></button>
            <button class="btn btn-sm btn-ghost" id="mapToggle"></button>
          </div>
        </div>
        <div class="flex-dates hidden" id="flexDates"></div>
        <div class="sort-tabs" id="sortTabs">
          <button class="sort-tab active" data-sort="rec"><b>Recommended</b><small id="sRec">—</small></button>
          <button class="sort-tab" data-sort="price"><b>Lowest price</b><small id="sPrice">—</small></button>
          <button class="sort-tab" data-sort="rating"><b>Top rated</b><small id="sRating">—</small></button>
          <button class="sort-tab hidden" data-sort="dist" id="distTab"><b>Distance</b><small id="sDist">—</small></button>
        </div>
        <div id="results"></div>
        <div style="text-align:center;margin-top:8px"><button class="btn btn-ghost hidden" id="moreBtn">Show more hotels</button></div>
      </section>

      <div class="map-col hidden" id="mapCol">
        <div id="map"></div>
        <label class="map-auto"><input type="checkbox" id="mapAuto" checked>Search as I move the map</label>
        <div class="map-status hidden" id="mapStatus"></div>
      </div>
    </div>
  </main>

  <script src="/js/ps.js"></script>
  <script>
  (async function () {
    PS.header({ active: "stays" });
    PS.footer();
    const q = PS.qs();
    PS.staysSearch(document.getElementById("searchHost"), q);
    document.getElementById("openFilters").innerHTML = PS.icon("filter", 16) + "Filters";
    const mapBtn = document.getElementById("mapToggle");
    mapBtn.innerHTML = PS.icon("map", 16) + "Map";

    const results = document.getElementById("results");
    const meta = document.getElementById("resMeta");
    const title = document.getElementById("resTitle");
    const moreBtn = document.getElementById("moreBtn");

    if (!q.placeId || !q.checkin || !q.checkout) {
      document.getElementById("filters").classList.add("hidden");
      document.getElementById("layout").style.gridTemplateColumns = "1fr";
      document.getElementById("mapToggle").classList.add("hidden");
      document.getElementById("openFilters").remove();
      title.textContent = "Find your stay";
      meta.textContent = "Choose a destination and dates above to see live prices.";
      document.getElementById("sortTabs").classList.add("hidden");
      results.innerHTML = empty("search", "Where would you like to stay?", "Search a city, neighborhood, landmark or hotel name to get started.",
        `<div class="pill-row" style="justify-content:center">${PS.DESTS.slice(0, 8).map(d => `<a class="pill" href="${PS.url("/hotels", { placeId: d.placeId, dest: d.name, destDetail: d.detail, checkin: PS.iso(PS.addDays(PS.today(), 14)), checkout: PS.iso(PS.addDays(PS.today(), 17)), adults: 2, rooms: 1 })}">${PS.esc(d.name)}</a>`).join("")}</div>`);
      return;
    }

    PS.local.set("ps_last_stays", q);
    const nights = PS.nights(q.checkin, q.checkout);
    const guests = (+q.adults || 2) + (q.children ? q.children.split(",").filter(Boolean).length : 0);
    title.textContent = q.dest ? `Stays in ${q.dest}` : "Hotels";
    document.title = `${q.dest || "Hotels"} hotels — PlanurStay`;
    const baseMeta = `${PS.fmtDate(q.checkin)} – ${PS.fmtDate(q.checkout)} · ${PS.plural(nights, "night")} · ${PS.plural(guests, "guest")}`;
    meta.textContent = baseMeta;

    const loader = PS.searchLoader("hotels", { place: q.dest });
    results.innerHTML = PS.skeleton.hotels(3);
    const filtersBox = document.getElementById("filters");
    filtersBox.classList.add("is-loading");
    filtersBox.insertAdjacentHTML("beforeend", `<div class="sk-wrap"><div class="skel" style="height:130px;border-radius:12px;margin-bottom:18px"></div>${PS.skeleton.filters(4)}</div>`);
    results.prepend(loader.el);

    let all = [], pricingInfo = {};
    try {
      const r = await PS.api("/api/stays/search", { method: "POST", body: { currency: PS.cur(),
        placeId: q.placeId, checkin: q.checkin, checkout: q.checkout, dest: q.dest, destDetail: q.destDetail,
        adults: +q.adults || 2, rooms: +q.rooms || 1,
        childAges: q.children ? q.children.split(",").filter(s => s !== "").map(Number) : [],
      }});
      all = r.data || [];
      pricingInfo = r.pricing || {};
      loader.done();
      filtersBox.classList.remove("is-loading");
    } catch (e) {
      filtersBox.classList.add("hidden"); document.getElementById("layout").style.gridTemplateColumns = "1fr";
      results.innerHTML = empty("alert", "We couldn't load hotels", PS.esc(e.message || "Please try again in a moment."), `<button class="btn btn-primary" onclick="location.reload()">Try again</button>`);
      meta.textContent = baseMeta;
      return;
    }

    if (!all.length) {
      filtersBox.classList.add("hidden"); document.getElementById("layout").style.gridTemplateColumns = "1fr";
      results.innerHTML = empty("bed", "No rooms available", "Nothing is bookable for these dates right now. Try different dates or a nearby area.", "");
      document.getElementById("sortTabs").classList.add("hidden");
      return;
    }

    // ─── Derive facets ───
    const enrich = (h) => {
      h.deal = h.strikeTotal ? Math.round((1 - h.total / h.strikeTotal) * 100) : 0;
      h.meals = h.meals || [];
      h.breakfast = /breakfast|half board|full board|all inclusive/i.test(h.board || "");
      if (h.refundAny == null) h.refundAny = h.refundable;
      h.rec = (h.rating || 6) * 10 + (h.stars || 0) * 2 + Math.min(h.deal, 25) + Math.log10((h.reviews || 0) + 1) * 3 + (h.refundable ? 4 : 0);
    };
    all.forEach(enrich);
    const priceEl = document.getElementById("fPrice");
    let pMin = 0, pMax = 0;
    // Recomputed when map searches add hotels; a slider left at max means "any price". Per night, like the cards.
    function refreshFacets() {
      // Member-only prices are never shown to guests (hotel price rules), so facets use public prices only
      const pubAll = all.filter(h => !h.memberOnly);
      const prices = (pubAll.length ? pubAll : all).map(h => h.perNight).sort((a, b) => a - b);
      const wasAny = !st || st.max >= pMax;
      pMin = Math.floor(prices[0]); pMax = Math.ceil(prices[prices.length - 1]);
      priceEl.min = pMin; priceEl.max = pMax; priceEl.step = Math.max(1, Math.round((pMax - pMin) / 100));
      if (wasAny) { if (st) st.max = pMax; priceEl.value = pMax; }
      document.getElementById("fPriceMin").textContent = PS.money(pMin, PS.cur(), 0);
      document.getElementById("fPriceTop").textContent = PS.money(pMax, PS.cur(), 0) + "+";
    }

    // ─── Filter definitions ───
    const MEALS = [["breakfast", "Breakfast included"], ["half", "Half board"], ["full", "Full board"], ["all", "All inclusive"], ["room", "Room only"]];
    const hasMeal = (h, m) => m === "breakfast" ? h.meals.some(x => x !== "room") || h.breakfast : h.meals.includes(m);
    const RATINGS = [[9, "Wonderful"], [8, "Very good"], [7, "Good"], [6, "Pleasant"]];
    const ROOM_FEAT = [["ac", "Air conditioning"], ["heating", "Heating"], ["coffee", "Coffee/tea maker"], ["nonsmoking", "Non-smoking rooms"], ["family", "Family rooms"], ["roomservice", "Room service"]];
    const FACIL = [["wifi", "Free Wi-Fi"], ["parking", "Parking"], ["pool", "Pool"], ["gym", "Fitness center"], ["spa", "Spa"], ["restaurant", "Restaurant"], ["bar", "Bar"], ["pets", "Pet-friendly"], ["shuttle", "Airport shuttle"], ["accessible", "Wheelchair accessible"], ["frontdesk", "24-hour front desk"], ["laundry", "Laundry"], ["terrace", "Terrace or garden"], ["sauna", "Sauna"], ["hottub", "Hot tub"], ["beach", "Beachfront"], ["kids", "Kids' club or playground"], ["business", "Business center"], ["ev", "EV charging"], ["elevator", "Elevator"]];
    const POPULAR = [
      ["Free cancellation", "refund"], ["Breakfast included", "meals", "breakfast"], ["Deals", "deal"],
      ["Parking", "amen", "parking"], ["Pool", "amen", "pool"], ["Fitness center", "amen", "gym"], ["Hotels", "types", "Hotel"], ["Apartments", "types", "Apartment"],
    ];
    const blank = () => ({ name: "", max: pMax, refund: false, deal: false, rating: 0, stars: new Set(), maxDist: 0, brands: new Set(), amen: new Set(), meals: new Set(), types: new Set(), cities: new Set() });
    let st = null;
    refreshFacets();
    st = { sort: "rec", shown: 20, landmark: null, ...blank() };

    // A hotel passes every filter except `skip` (so each group's counts reflect the other filters).
    function pass(h, skip) {
      const n = st.name.toLowerCase();
      return (skip === "price" || st.max >= pMax || h.perNight <= st.max) &&
        (!n || (h.name || "").toLowerCase().includes(n)) &&
        (skip === "refund" || !st.refund || h.refundAny) && (skip === "deal" || !st.deal || h.deal >= 5) &&
        (skip === "rating" || !st.rating || h.rating >= st.rating) &&
        (skip === "stars" || !st.stars.size || st.stars.has(Math.round(h.stars || 0))) &&
        (skip === "dist" || !st.maxDist || (h.dist != null && h.dist <= st.maxDist)) &&
        (skip === "brands" || !st.brands.size || st.brands.has(h.brand || "")) &&
        (skip === "amen" || [...st.amen].every(k => (h.amen || []).includes(k))) &&
        (skip === "meals" || !st.meals.size || [...st.meals].some(m => hasMeal(h, m))) &&
        (skip === "types" || !st.types.size || st.types.has(h.ptype || "Other")) &&
        (skip === "cities" || !st.cities.size || st.cities.has(h.city || ""));
    }
    const count = (group, test) => all.filter(h => pass(h, group) && test(h)).length;
    const valueTest = { refund: () => h => h.refundAny, deal: () => h => h.deal >= 5,
      meals: m => h => hasMeal(h, m), amen: k => h => (h.amen || []).includes(k) && [...st.amen].every(x => (h.amen || []).includes(x)),
      types: t => h => (h.ptype || "Other") === t, brands: b => h => (h.brand || "") === b, stars: v => h => Math.round(h.stars || 0) === v, cities: c => h => (h.city || "") === c };
    const isOn = (k, v) => v === undefined ? !!st[k] : st[k].has(v);
    const box = (k, v, label, n) => `<label class="f-check"><input type="checkbox" data-k="${k}" ${v !== undefined ? `data-v="${PS.esc(v)}"` : ""} ${isOn(k, v) ? "checked" : ""} ${n || isOn(k, v) ? "" : "disabled"}><span>${label}</span><span class="cnt">${n}</span></label>`;
    const optBox = (k, v, label) => box(k, v, label, count(k, valueTest[k](v)));
    const more = { brands: false, fac: false };
    const listGroup = (title, key, rows, limit, moreKey) => {
      if (!rows.length) return "";
      const shown = more[moreKey] || rows.length <= limit + 1 ? rows : rows.slice(0, limit);
      return `<div class="f-group"><h4>${title}</h4>${shown.join("")}${rows.length > shown.length || more[moreKey] && rows.length > limit + 1 ? `<button type="button" class="link-btn" data-more="${moreKey}">${more[moreKey] ? "Show less" : `Show all ${rows.length}`}</button>` : ""}</div>`;
    };

    function renderF() {
      const has = (k) => all.some(h => (h.amen || []).includes(k));
      // Group A: sits under the price slider
      const popular = POPULAR.filter(([, k, v]) => k !== "amen" && k !== "types" || (k === "amen" ? has(v) : all.some(h => h.ptype === v)))
        .filter(([, k, v]) => isOn(k, v) || count(k, valueTest[k](v))).map(([label, k, v]) => optBox(k, v, label));
      const ratingRows = [`<label class="f-check"><input type="radio" name="fRating" data-k="rating" data-v="0" ${!st.rating ? "checked" : ""}><span>Any</span></label>`]
        .concat(RATINGS.map(([v, w]) => { const n = count("rating", h => h.rating >= v);
          return `<label class="f-check"><input type="radio" name="fRating" data-k="rating" data-v="${v}" ${st.rating === v ? "checked" : ""} ${n ? "" : "disabled"}><span><b class="rt-chip">${v}+</b>${w}</span><span class="cnt">${n}</span></label>`; }));
      document.getElementById("fDynA").innerHTML =
        `<div class="f-group"><h4>Popular filters</h4>${popular.join("")}</div>` +
        `<div class="f-group"><h4>Guest rating</h4>${ratingRows.join("")}</div>` +
        `<div class="f-group"><h4>Star rating</h4>${[5, 4, 3, 2, 1, 0].filter(v => all.some(h => Math.round(h.stars || 0) === v)).map(v => optBox("stars", v, v ? `<span class="star-lbl">${"★".repeat(v)}</span>${v} star${v > 1 ? "s" : ""}` : "Unrated")).join("")}</div>`;

      // Group B: after distance
      const brandCounts = {}; all.forEach(h => { const b = h.brand || ""; brandCounts[b] = (brandCounts[b] || 0) + 1; });
      const brandRows = Object.keys(brandCounts).sort((a, b) => (a === "" ? -1 : b === "" ? 1 : brandCounts[b] - brandCounts[a] || a.localeCompare(b)))
        .map(b => optBox("brands", b, b ? PS.esc(b) : "Independent hotels"));
      const types = [...new Set(all.map(h => h.ptype || "Other"))].sort((a, b) => all.filter(h => (h.ptype || "Other") === b).length - all.filter(h => (h.ptype || "Other") === a).length);
      const cities = [...new Set(all.map(h => h.city).filter(Boolean))];
      document.getElementById("fDynB").innerHTML =
        `<div class="f-group"><h4>Reservation policy</h4>${optBox("refund", undefined, "Free cancellation")}</div>` +
        `<div class="f-group"><h4>Meal plans</h4>${MEALS.filter(([m]) => all.some(h => hasMeal(h, m))).map(([m, l]) => optBox("meals", m, l)).join("")}</div>` +
        (types.length > 1 ? `<div class="f-group"><h4>Property type</h4>${types.map(t => optBox("types", t, t === "Other" ? "Other" : t + "s")).join("")}</div>` : "") +
        (Object.keys(brandCounts).length > 1 ? listGroup("Brand", "brands", brandRows, 6, "brands") : "") +
        listGroup("Room features", "amen", ROOM_FEAT.filter(([k]) => has(k)).map(([k, l]) => optBox("amen", k, l)), 6, "room") +
        listGroup("Facilities", "amen", FACIL.filter(([k]) => has(k)).map(([k, l]) => optBox("amen", k, l)), 8, "fac") +
        (cities.length > 1 ? `<div class="f-group"><h4>Neighborhood</h4>${cities.sort((a, b) => all.filter(h => h.city === b).length - all.filter(h => h.city === a).length).map(c => optBox("cities", c, PS.esc(c))).join("")}</div>` : "");

      // Distance pills (from the landmark, or the city centre)
      const ref = st.landmark || centre;
      document.getElementById("fDistLabel").textContent = ref ? `From ${st.landmark ? st.landmark.name : "the city centre"}` : "";
      document.getElementById("fDist").innerHTML = ref ? `<button class="pill ${!st.maxDist ? "active" : ""}" data-dist="0">Any</button>` + DIST_STEPS.map(([v, l]) => { const n = count("dist", h => h.dist != null && h.dist <= v);
        return `<button class="pill ${Math.abs(st.maxDist - v) < 1e-6 ? "active" : ""}" data-dist="${v}" ${n ? "" : "disabled"}>Under ${l}</button>`; }).join("") : "";
      const any = st.name || st.max < pMax || st.refund || st.deal || st.rating || st.maxDist || st.landmark || ["stars", "brands", "amen", "meals", "types", "cities"].some(k => st[k].size);
      document.getElementById("clearFilters").classList.toggle("off", !any);
    }
    const filtersPanel = document.getElementById("filters");
    filtersPanel.addEventListener("change", (e) => {
      const i = e.target; if (!i.dataset.k) return;
      const k = i.dataset.k, v = i.dataset.v;
      if (k === "rating") st.rating = +v;
      else if (v === undefined) st[k] = i.checked;
      else { const val = k === "stars" ? +v : v; i.checked ? st[k].add(val) : st[k].delete(val); }
      st.shown = 20; apply();
    });
    filtersPanel.addEventListener("click", (e) => {
      const m = e.target.closest("[data-more]"); if (m) { more[m.dataset.more] = !more[m.dataset.more]; renderF(); return; }
      const d = e.target.closest("[data-dist]"); if (d) { st.maxDist = +d.dataset.dist; st.shown = 20; apply(); }
    });

    function apply() { renderF(); renderList(); }
    function renderList() {
      let list = all.filter(h => pass(h));
      const by = {
        dist: (a, b) => (a.dist ?? 1e9) - (b.dist ?? 1e9),
        rec: (a, b) => b.rec - a.rec,
        price: (a, b) => a.total - b.total,
        rating: (a, b) => (b.rating - a.rating) || (b.reviews - a.reviews),
      };
      const top = (k) => [...list].filter(h => !h.memberOnly).sort(by[k])[0];
      const lbl = (h) => h ? `${PS.money(h.perNight, h.currency, 0)} avg/night` : "Member prices";
      document.getElementById("sRec").textContent = lbl(top("rec"));
      document.getElementById("sPrice").textContent = lbl(top("price"));
      document.getElementById("sRating").textContent = lbl(top("rating"));
      if (st.landmark || centre) { const n = [...list].sort(by.dist)[0]; document.getElementById("sDist").textContent = n && n.dist != null ? `${fmtDist(n.dist)} ${st.landmark ? "away" : "from centre"}` : "—"; }
      list.sort(by[st.sort]);
      meta.textContent = `${list.length} of ${all.length} properties · ${baseMeta}`;
      document.getElementById("fPriceMax").textContent = st.max >= pMax ? "Any" : "Up to " + PS.money(st.max, PS.cur(), 0);
      document.getElementById("openFilters").innerHTML = PS.icon("filter", 16) + "Filters" + (list.length < all.length ? ` (${list.length})` : "");

      if (!list.length) {
        results.innerHTML = empty("filter", "No stays match your filters", "Try removing a filter or widening your price range.", `<button class="btn btn-primary" id="emptyClear">Clear filters</button>`);
        document.getElementById("emptyClear").onclick = clearAll;
        moreBtn.classList.add("hidden");
        drawMap([]);
        return;
      }
      const shown = list.slice(0, st.shown);
      const memberBanner = pricingInfo.package ? `<div class="member-bar pkg">${PS.icon("gift", 16)}<span><b>Package prices are on.</b> Your flight booking unlocks about ${Math.floor((1 - (pricingInfo.memberFactor || 1)) * 100)}% off hotels marked "Package price" for your trip.</span></div>`
        : !pricingInfo.member ? `<a class="member-bar" href="${PS.loginUrl()}">${PS.icon("tag", 16)}<span><b>Member prices are on.</b> Sign in or join free to save about ${Math.floor((1 - (pricingInfo.memberFactor || 1)) * 100)}% on these hotels.</span>${PS.icon("right", 16)}</a>` : "";
      const cards = shown.map(card);
      cards.splice(Math.min(3, cards.length), 0, trackerHTML());
      results.innerHTML = memberBanner + cards.join("");
      bindTracker();
      PS.saved.bind(results);
      moreBtn.classList.toggle("hidden", list.length <= st.shown);
      moreBtn.textContent = `Show ${Math.min(20, list.length - st.shown)} more`;
      drawMap(list);
    }

    function hotelLink(h) {
      return PS.url(`/hotel/${h.id}`, { checkin: q.checkin, checkout: q.checkout, adults: q.adults, rooms: q.rooms, children: q.children, dest: q.dest, placeId: q.placeId, destDetail: q.destDetail });
    }

    function card(h) {
      const great = h.rating >= 8.5;
      return `<div class="hcard-wrap"><button type="button" class="save-btn card" data-save="${PS.esc(JSON.stringify({ hotelId: h.id, name: h.name, photo: h.thumb || h.photo || "", city: h.city || "", stars: h.stars || 0, rating: h.rating || 0 }))}"></button><a class="hcard" href="${hotelLink(h)}" data-id="${h.id}" target="_blank" rel="noopener">
        <div class="hcard-img">${h.photo ? `<img src="${PS.esc(h.photo)}" alt="" loading="lazy" onerror="this.remove()">` : ""}${h.deal >= 5 ? `<span class="hcard-badge">${h.deal}% off</span>` : ""}</div>
        <div class="hcard-body">
          <div style="min-width:0">
            <div class="stars">${PS.stars(h.stars)}</div>
            <h3>${PS.esc(h.name)}</h3>
            <div class="addr">${PS.icon("pin", 14)}${PS.esc([h.address, h.city].filter(Boolean).join(", "))}</div>
            ${h.dist != null && (st.landmark || centre) ? `<div class="dist-line">${PS.icon("map", 14)}<b>${fmtDist(h.dist)}</b> from ${st.landmark ? PS.esc(st.landmark.name) : "centre"}</div>` : ""}
            ${h.brand ? `<div class="brand-line">${PS.esc(h.brand)}</div>` : ""}
            ${h.rating ? `<div class="rating-row"><span class="score ${great ? "great" : ""}">${Number(h.rating).toFixed(1)}</span><b>${PS.ratingWord(h.rating)}</b><small>${h.reviews ? h.reviews.toLocaleString() + " reviews" : ""}</small></div>` : ""}
            <div class="tags">
              ${h.refundable ? `<span class="tag green">${PS.icon("check", 13, 3)}Free cancellation</span>` : h.refundAny ? `<span class="tag green">${PS.icon("check", 13, 3)}Free cancellation available</span>` : `<span class="tag">Non-refundable</span>`}
              ${h.breakfast ? `<span class="tag amber">${PS.icon("coffee", 13)}${PS.esc(h.board)}</span>` : hasMeal(h, "breakfast") ? `<span class="tag amber">${PS.icon("coffee", 13)}Breakfast available</span>` : ""}
            </div>
          </div>
          <div class="price-col">
            ${h.memberOnly ? `<span class="tag green">${PS.icon("tag", 13)}Member price</span>
              <span class="price-sub" style="margin-top:4px">Sign in to see this price</span>
              <span class="btn btn-primary btn-sm">View rooms</span>` : `
            ${h.memberPrice ? `<span class="tag green" style="margin-bottom:4px">${PS.icon(h.packagePrice ? "gift" : "tag", 13)}${h.packagePrice ? "Package price" : "Member price"}</span>` : ""}
            ${h.strikeTotal ? `<span class="price-strike">${PS.money(h.strikeTotal / h.nights, h.currency, 0)}</span>` : ""}
            <span class="price-big">${PS.money(h.perNight, h.currency, 0)}</span>
            <span class="price-sub">per night</span>
            <span class="price-total"><b>${PS.money(h.total, h.currency, 0)}</b> total · ${h.nights} night${h.nights > 1 ? "s" : ""}</span>
            ${!pricingInfo.member && !h.packagePrice && pricingInfo.memberFactor ? `<span class="member-nudge">Lower member price when signed in</span>` : ""}
            <span class="btn btn-primary btn-sm">View rooms</span>`}
          </div>
        </div>
      </a></div>`;
    }

    function empty(icon, h, p, extra) {
      return `<div class="empty"><div class="ei">${PS.icon(icon, 28)}</div><h3>${h}</h3><p>${p}</p>${extra || ""}</div>`;
    }

    function clearAll() {
      Object.assign(st, blank(), { shown: 20 });
      document.getElementById("fName").value = ""; priceEl.value = pMax;
      document.getElementById("fLandmark").value = "";
      setLandmark(null, true);
      apply();
    }

    // ─── Distance from a landmark ───
    const LANDMARKS = {
      paris: [["Eiffel Tower", 48.8584, 2.2945], ["Louvre Museum", 48.8606, 2.3376], ["Notre-Dame", 48.8530, 2.3499], ["Arc de Triomphe", 48.8738, 2.2950], ["Sacré-Cœur, Montmartre", 48.8867, 2.3431], ["Gare du Nord", 48.8809, 2.3553]],
      london: [["Big Ben", 51.5007, -0.1246], ["Tower of London", 51.5081, -0.0759], ["Buckingham Palace", 51.5014, -0.1419], ["British Museum", 51.5194, -0.1270], ["Covent Garden", 51.5117, -0.1240], ["King's Cross St Pancras", 51.5309, -0.1233]],
      newyork: [["Times Square", 40.7580, -73.9855], ["Central Park", 40.7829, -73.9654], ["Empire State Building", 40.7484, -73.9857], ["Grand Central Terminal", 40.7527, -73.9772], ["Brooklyn Bridge", 40.7061, -73.9969], ["Battery Park (Statue of Liberty ferry)", 40.7033, -74.0170]],
      tokyo: [["Shibuya Crossing", 35.6595, 139.7005], ["Shinjuku Station", 35.6896, 139.7006], ["Tokyo Station", 35.6812, 139.7671], ["Senso-ji, Asakusa", 35.7148, 139.7967], ["Tokyo Tower", 35.6586, 139.7454], ["Ginza", 35.6717, 139.7650]],
      dubai: [["Burj Khalifa", 25.1972, 55.2744], ["The Dubai Mall", 25.1985, 55.2796], ["Dubai Marina", 25.0805, 55.1403], ["Atlantis, Palm Jumeirah", 25.1304, 55.1171], ["Dubai Airport (DXB)", 25.2532, 55.3657], ["Al Fahidi (Old Dubai)", 25.2637, 55.2972]],
      rome: [["Colosseum", 41.8902, 12.4922], ["St Peter's Basilica", 41.9022, 12.4539], ["Trevi Fountain", 41.9009, 12.4833], ["Pantheon", 41.8986, 12.4769], ["Spanish Steps", 41.9060, 12.4828], ["Roma Termini", 41.9010, 12.5016]],
      toronto: [["CN Tower", 43.6426, -79.3871], ["Union Station", 43.6453, -79.3806], ["Eaton Centre", 43.6544, -79.3807], ["Yorkville", 43.6708, -79.3935], ["Rogers Centre", 43.6414, -79.3894], ["Pearson Airport (YYZ)", 43.6777, -79.6248]],
      lasvegas: [["The Strip (Bellagio)", 36.1126, -115.1767], ["Sphere", 36.1207, -115.1621], ["Fremont Street", 36.1699, -115.1422], ["Convention Center", 36.1314, -115.1519], ["Harry Reid Airport (LAS)", 36.0840, -115.1537]],
      miami: [["South Beach", 25.7826, -80.1341], ["Brickell", 25.7617, -80.1918], ["Wynwood Walls", 25.8010, -80.1994], ["Port of Miami", 25.7781, -80.1794], ["Kaseya Center", 25.7814, -80.1870], ["Miami Airport (MIA)", 25.7959, -80.2870]],
      cancun: [["Hotel Zone (Punta Cancún)", 21.1360, -86.7440], ["Downtown Cancún", 21.1619, -86.8515], ["Playa Delfines", 21.0624, -86.7802], ["Isla Mujeres ferry", 21.1856, -86.8095], ["Cancún Airport (CUN)", 21.0365, -86.8771]],
    };
    const km = (a1, o1, a2, o2) => { const R = 6371, r = Math.PI / 180, dA = (a2 - a1) * r, dO = (o2 - o1) * r; const x = Math.sin(dA / 2) ** 2 + Math.cos(a1 * r) * Math.cos(a2 * r) * Math.sin(dO / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
    const useMiles = all.filter(h => h.country).every(h => h.country === "US");
    const fmtDist = (d) => useMiles ? `${(d * 0.621371).toFixed(d * 0.621371 < 10 ? 1 : 0)} mi` : `${d.toFixed(d < 10 ? 1 : 0)} km`;
    const DIST_STEPS = useMiles ? [[0.5, "½ mi"], [1, "1 mi"], [3, "3 mi"]].map(([v, l]) => [v / 0.621371, l]) : [[1, "1 km"], [2, "2 km"], [5, "5 km"]];
    let centre = null; // the searched place's centre (distance filter when no landmark is picked)
    function setDistances() {
      const ref = st.landmark || centre;
      all.forEach(h => { h.dist = ref && h.lat && h.lng ? km(ref.lat, ref.lng, h.lat, h.lng) : null; });
    }
    function setLandmark(lm, silent) {
      st.landmark = lm; st.maxDist = 0;
      setDistances();
      const distTab = document.getElementById("distTab"), act = document.getElementById("lmActive");
      distTab.classList.toggle("hidden", !lm && !centre);
      act.classList.toggle("hidden", !lm);
      document.getElementById("lmSugg").classList.toggle("hidden", !!lm);
      if (lm) {
        act.innerHTML = `<span>${PS.icon("map", 14)}${PS.esc(lm.name)}</span><button type="button" aria-label="Clear landmark">${PS.icon("x", 14, 2.6)}</button>`;
        act.querySelector("button").onclick = () => { document.getElementById("fLandmark").value = ""; setLandmark(null); };
        document.querySelectorAll(".sort-tab").forEach(x => x.classList.toggle("active", x === distTab));
        st.sort = "dist";
      } else if (st.sort === "dist") {
        st.sort = "rec";
        document.querySelectorAll(".sort-tab").forEach(x => x.classList.toggle("active", x.dataset.sort === "rec"));
      }
      if (!silent) { st.shown = 20; apply(); }
    }
    // City centre: the searched place's own location (hotel/landmark searches too); falls back to the middle of the results.
    PS.api(`/api/places/${encodeURIComponent(q.placeId)}/location`).then(r => r.data).catch(() => null).then(loc => {
      const pts = all.filter(h => h.lat && h.lng);
      if (!loc?.lat && pts.length) { const mid = (k) => pts.map(h => h[k]).sort((a, b) => a - b)[pts.length >> 1]; loc = { lat: mid("lat"), lng: mid("lng") }; }
      if (!loc?.lat) return;
      centre = { lat: loc.lat, lng: loc.lng };
      if (!st.landmark) { setDistances(); document.getElementById("distTab").classList.remove("hidden"); apply(); }
    });
    (function initLandmarks() {
      const pts = all.filter(h => h.lat && h.lng);
      const mid = pts.length ? { lat: pts.map(h => h.lat).sort((a, b) => a - b)[pts.length >> 1], lng: pts.map(h => h.lng).sort((a, b) => a - b)[pts.length >> 1] } : null;
      const set = mid && Object.values(LANDMARKS).find(l => km(l[0][1], l[0][2], mid.lat, mid.lng) < 40);
      const sugg = document.getElementById("lmSugg");
      sugg.innerHTML = set ? set.map(([n, la, ln], i) => `<button type="button" class="pill" data-i="${i}">${PS.esc(n)}</button>`).join("") : "";
      sugg.querySelectorAll(".pill").forEach(b => b.onclick = () => { const [n, la, ln] = set[+b.dataset.i]; document.getElementById("fLandmark").value = n; setLandmark({ name: n, lat: la, lng: ln }); });
      PS.autocomplete(document.querySelector(".lm-field"), {
        fetcher: async (text) => (await PS.api(`/api/places?q=${encodeURIComponent(text + (q.dest && !new RegExp(q.dest, "i").test(text) ? ", " + q.dest : ""))}`)).data,
        render: (p) => `<span class="ac-icon">${PS.icon("pin", 18)}</span><span style="min-width:0"><div class="ac-main">${PS.esc(p.name)}</div><div class="ac-sub">${PS.esc(p.detail || "")}</div></span>`,
        onSelect: async (p) => {
          const input = document.getElementById("fLandmark");
          input.value = p.name;
          try { const r = await PS.api(`/api/places/${encodeURIComponent(p.placeId)}/location`); setLandmark({ name: p.name, lat: r.data.lat, lng: r.data.lng }); }
          catch { input.value = ""; input.placeholder = "Couldn't find that place, try another"; }
        },
        empty: "No places found",
      });
    })();

    // ─── Wire filters ───
    let nameT;
    document.getElementById("fName").oninput = (e) => { clearTimeout(nameT); nameT = setTimeout(() => { st.name = e.target.value.trim(); st.shown = 20; apply(); }, 150); };
    priceEl.oninput = () => { st.max = +priceEl.value; st.shown = 20; renderList(); };
    priceEl.onchange = () => apply();
    document.getElementById("clearFilters").onclick = clearAll;
    document.querySelectorAll(".sort-tab").forEach(t => t.onclick = () => {
      document.querySelectorAll(".sort-tab").forEach(x => x.classList.remove("active")); t.classList.add("active"); st.sort = t.dataset.sort; apply();
    });
    moreBtn.onclick = () => { st.shown += 20; renderList(); };
    const filtersEl = document.getElementById("filters");
    document.getElementById("openFilters").onclick = () => filtersEl.classList.add("mobile-open");
    document.getElementById("closeFilters").onclick = () => filtersEl.classList.remove("mobile-open");
    document.getElementById("applyFilters").onclick = () => filtersEl.classList.remove("mobile-open");

    // ─── Map (Leaflet, loaded on demand) ───
    let map = null, markers = null, mapOn = false, lastList = [], fitted = false, moving = false;
    function drawMap(list) {
      lastList = list;
      if (!mapOn || !map) return;
      markers.clearLayers();
      const pts = [];
      list.slice(0, 400).forEach(h => {
        if (!h.lat || !h.lng) return;
        // Zoomed out: small dots instead of overlapping price pills
        const far = fitted && map.getZoom() < 11;
        const m = far
          ? L.circleMarker([h.lat, h.lng], { radius: 6, color: "#fff", weight: 2, fillColor: "#1f5bff", fillOpacity: 1 }).addTo(markers)
          : L.marker([h.lat, h.lng], { icon: L.divIcon({ className: "", html: `<span class="map-price" data-id="${h.id}">${h.memberOnly ? "Member price" : PS.money(h.perNight, h.currency, 0)}</span>`, iconSize: null }) }).addTo(markers);
        m.bindPopup(`<a href="${hotelLink(h)}" target="_blank" rel="noopener" style="display:block;width:200px">${h.thumb ? `<img src="${PS.esc(h.thumb)}" style="width:100%;height:100px;object-fit:cover;border-radius:8px;margin-bottom:6px">` : ""}<b style="color:#0b1b3f">${PS.esc(h.name)}</b><br><span style="color:#4a5572">${h.memberOnly ? "Member price · sign in to see" : `${PS.money(h.perNight, h.currency, 0)}/night · ${PS.money(h.total, h.currency, 0)} total`}</span></a>`);
        pts.push([h.lat, h.lng]);
      });
      // Only frame the results once; after that the user controls the view.
      if (pts.length && !fitted) { fitted = true; moving = true; map.fitBounds(pts, { padding: [30, 30], maxZoom: 15 }); setTimeout(() => (moving = false), 400); }
    }

    // ─── "Search as I move the map": load hotels in whatever area is visible ───
    const searchedAreas = [];
    let areaT = null, areaSeq = 0;
    const mapStatus = (html) => { const el = document.getElementById("mapStatus"); el.innerHTML = html; el.classList.toggle("hidden", !html); };
    function onMapMove() {
      if (moving || !document.getElementById("mapAuto").checked) return;
      clearTimeout(areaT);
      areaT = setTimeout(searchArea, 450);
    }
    async function searchArea() {
      const c = map.getCenter(), b = map.getBounds();
      const radius = Math.min(50000, Math.max(800, map.distance(c, b.getNorthEast())));
      // Skip if this view is already covered by a previous area search
      if (searchedAreas.some(a => map.distance(c, a.c) + radius <= a.r * 1.05)) return;
      const my = ++areaSeq;
      mapStatus(`<span class="spinner" style="width:14px;height:14px;border-width:2px"></span>Searching this area…`);
      try {
        const r = await PS.api("/api/stays/search", { method: "POST", body: { currency: PS.cur(),
          latitude: c.lat, longitude: c.lng, radius, checkin: q.checkin, checkout: q.checkout,
          adults: +q.adults || 2, rooms: +q.rooms || 1, childAges: q.children ? q.children.split(",").filter(x => x !== "").map(Number) : [], limit: 150,
        }});
        if (my !== areaSeq) return;
        searchedAreas.push({ c, r: radius });
        const have = new Set(all.map(h => h.id));
        const fresh = (r.data || []).filter(h => !have.has(h.id));
        fresh.forEach(enrich);
        all.push(...fresh);
        const ref = st.landmark || centre;
        if (ref) fresh.forEach(h => { h.dist = h.lat && h.lng ? km(ref.lat, ref.lng, h.lat, h.lng) : null; });
        if (fresh.length) { refreshFacets(); apply(); }
        mapStatus(fresh.length ? `${PS.icon("check", 14, 3)}${fresh.length} more hotel${fresh.length === 1 ? "" : "s"} in this area` : "No other hotels available here");
        setTimeout(() => { if (my === areaSeq) mapStatus(""); }, 2600);
      } catch { if (my === areaSeq) mapStatus("Couldn't load this area"); }
    }
    mapBtn.onclick = async () => {
      mapOn = !mapOn;
      document.getElementById("mapCol").classList.toggle("hidden", !mapOn);
      document.getElementById("layout").classList.toggle("with-map", mapOn);
      mapBtn.innerHTML = mapOn ? PS.icon("list", 16) + "Hide map" : PS.icon("map", 16) + "Map";
      if (mapOn && !map) {
        try { await PS.leaflet(); } catch { PS.toast("Map couldn't load"); return; }
        map = L.map("map", { scrollWheelZoom: true });
        PS.mapTiles(map);
        markers = L.layerGroup().addTo(map);
        map.on("moveend", onMapMove);
        let lastFar = null;
        map.on("zoomend", () => { const far = map.getZoom() < 11; if (far !== lastFar) { lastFar = far; drawMap(lastList); } });
        // The initial search area counts as already covered
        const pts0 = all.filter(h => h.lat && h.lng);
        if (pts0.length) { const bb = L.latLngBounds(pts0.map(h => [h.lat, h.lng])); searchedAreas.push({ c: bb.getCenter(), r: map.distance(bb.getCenter(), bb.getNorthEast()) }); }
      }
      if (map) { setTimeout(() => { map.invalidateSize(); drawMap(lastList); }, 50); }
    };
    // Warm the server cache for a hotel as soon as the user shows intent.
    const warmed = new Set();
    const warm = (e) => {
      const c = e.target.closest?.(".hcard"); if (!c || warmed.has(c.dataset.id)) return;
      warmed.add(c.dataset.id);
      fetch(`/api/hotels/${c.dataset.id}`).catch(() => {});
      fetch("/api/stays/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ currency: PS.cur(), hotelId: c.dataset.id, checkin: q.checkin, checkout: q.checkout, adults: +q.adults || 2, rooms: +q.rooms || 1, childAges: q.children ? q.children.split(",").filter(s => s !== "").map(Number) : [] }) }).catch(() => {});
    };
    results.addEventListener("mouseover", warm);
    results.addEventListener("touchstart", warm, { passive: true });
    results.addEventListener("mouseover", (e) => {
      const c = e.target.closest(".hcard"); if (!c || !mapOn) return;
      document.querySelectorAll(".map-price").forEach(m => m.classList.toggle("hl", m.dataset.id === c.dataset.id));
    });

    // ─── Sidebar map preview ───
    document.getElementById("miniMapBtn").onclick = () => mapBtn.click();
    PS.leaflet().then(() => {
      const pts = all.filter(h => h.lat && h.lng).map(h => [h.lat, h.lng]);
      if (!pts.length) { document.getElementById("miniMapGroup").remove(); return; }
      const mm = L.map("miniMap", { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false });
      PS.mapTiles(mm);
      pts.slice(0, 80).forEach(p => L.circleMarker(p, { radius: 4, color: "#1f5bff", weight: 2, fillColor: "#fff", fillOpacity: 1 }).addTo(mm));
      mm.fitBounds(pts, { padding: [12, 12], maxZoom: 14 });
    }).catch(() => document.getElementById("miniMapGroup")?.remove());

    // ─── Price alert: email me when prices for this search drop ───
    // Inline tracker card in the results (plus the header button, which scrolls to it).
    const alertKey = "ps_alert:" + [q.placeId, q.checkin, q.checkout, q.adults, q.rooms].join("|");
    let alertEmail = "";
    PS.auth().then(a => { if (a.loggedIn) { alertEmail = a.user.email; document.querySelectorAll(".track-card input[type=email]").forEach(i => { if (!i.value) i.value = alertEmail; }); } });
    const lowNight = () => Math.min(...all.filter(h => !h.memberOnly).map(h => h.perNight));
    function trackerHTML() {
      if (PS.local.get(alertKey)) return `<div class="track-card done">${PS.icon("check", 20, 2.6)}<div><b>You're tracking prices for this search</b><span>We'll email you when hotels in ${PS.esc(q.dest || "this area")} get cheaper for ${PS.fmtDate(q.checkin)} – ${PS.fmtDate(q.checkout)}.</span></div></div>`;
      const low = lowNight();
      return `<div class="track-card" id="trackCard">
        <span class="tc-ic">${PS.icon("bolt", 22, 2.2)}</span>
        <div class="tc-txt"><b>Track prices for ${PS.esc(q.dest || "this search")}</b>
          <span>${PS.fmtDate(q.checkin)} – ${PS.fmtDate(q.checkout)}${Number.isFinite(low) ? ` · from <b>${PS.money(low, PS.cur(), 0)}</b>/night now` : ""}. We check every day and email you when prices drop.</span></div>
        <form class="tc-form" novalidate><input type="email" autocomplete="email" required placeholder="Your email" aria-label="Email for price alerts" value="${PS.esc(alertEmail)}"><button class="btn btn-coral" type="submit">Track prices</button></form>
        <div class="tc-msg"></div>
      </div>`;
    }
    function bindTracker() {
      const card = document.getElementById("trackCard"); if (!card) return;
      card.querySelector("form").onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector("button"), email = e.target.querySelector("input").value.trim(), msg = card.querySelector(".tc-msg");
        if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)) { msg.innerHTML = `<span class="bad">Enter a valid email address.</span>`; return; }
        btn.disabled = true; btn.textContent = "Setting up…";
        try {
          const low = lowNight();
          const r = await PS.api("/api/alerts", { method: "POST", body: { email, placeId: q.placeId, dest: q.dest, destDetail: q.destDetail, checkin: q.checkin, checkout: q.checkout, adults: +q.adults || 2, rooms: +q.rooms || 1, currency: PS.cur(), price: Number.isFinite(low) ? low : null } });
          PS.local.set(alertKey, 1);
          PS.track("page", { alert: 1 });
          card.outerHTML = trackerHTML().replace("You're tracking prices for this search", r.already ? "You're already tracking this search" : "Price alert is on! Check your inbox");
          alertBtn.innerHTML = PS.icon("check", 16, 2.6) + "Tracking prices";
        } catch (err) { btn.disabled = false; btn.textContent = "Track prices"; msg.innerHTML = `<span class="bad">${PS.esc(err.message)}</span>`; }
      };
    }
    const alertBtn = document.getElementById("alertBtn");
    alertBtn.innerHTML = PS.local.get(alertKey) ? PS.icon("check", 16, 2.6) + "Tracking prices" : PS.icon("bolt", 16) + "Track prices";
    alertBtn.classList.remove("hidden");
    alertBtn.classList.add("track-btn");
    alertBtn.onclick = () => {
      const c = document.getElementById("trackCard") || document.querySelector(".track-card");
      if (!c) return;
      c.scrollIntoView({ behavior: "smooth", block: "center" });
      c.classList.remove("pulse"); void c.offsetWidth; c.classList.add("pulse");
      setTimeout(() => c.querySelector("input")?.focus({ preventScroll: true }), 400);
    };

    apply();

    // ─── Flexible dates strip (loads after the results, never blocks them) ───
    (async function loadFlex() {
      const box = document.getElementById("flexDates");
      // 20 cheapest + 20 top recommended, so "from" lines up with the Lowest price tab
      const pool = all.filter(h => !h.memberOnly);
      const ids = [...new Set([...[...pool].sort((a, b) => a.total - b.total).slice(0, 20), ...[...pool].sort((a, b) => b.rec - a.rec).slice(0, 20)].map(h => h.id))];
      if (ids.length < 3) return;
      box.classList.remove("hidden");
      box.innerHTML = `<div class="fd-head"><b>Flexible dates?</b><span>Checking nearby dates…</span></div><div class="fd-row">${Array.from({ length: 7 }, () => `<div class="fd-chip skel"></div>`).join("")}</div>`;
      try {
        const r = await PS.api("/api/stays/flex", { method: "POST", body: { hotelIds: ids, checkin: q.checkin, checkout: q.checkout, adults: +q.adults || 2, rooms: +q.rooms || 1, currency: PS.cur() } });
        const rows = r.data.filter(x => x.lowNight != null);
        const cur = rows.find(x => x.offset === 0);
        if (rows.length < 2 || !cur) { box.classList.add("hidden"); return; }
        const min = Math.min(...rows.map(x => x.lowNight));
        const best = rows.find(x => x.lowNight === min);
        const save = cur.lowNight - min;
        const hint = best.offset !== 0 && save / cur.lowNight >= 0.05
          ? `Save <b>${PS.money(save, PS.cur(), 0)}/night</b> by checking in ${PS.fmtDay(best.checkin)}`
          : "Your dates are among the cheapest";
        box.innerHTML = `<div class="fd-head"><b>Flexible dates?</b><span>${hint}</span></div>
          <div class="fd-row">${rows.map(x => `<a class="fd-chip${x.offset === 0 ? " on" : ""}${x.lowNight === min ? " low" : ""}" href="${PS.url("/hotels", { ...q, checkin: x.checkin, checkout: x.checkout })}">
            <small>${PS.fmtDate(x.checkin, { weekday: "short" })} ${PS.fmtDate(x.checkin)}</small>
            <b>${PS.money(x.lowNight, PS.cur(), 0)}</b><small>from /night</small></a>`).join("")}</div>`;
      } catch { box.classList.add("hidden"); }
    })();
  })();
