<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking confirmation — PlanurStay</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/ps.css">
</head>
<body>
  <main class="container" id="root" style="padding-bottom:40px"></main>

  <script src="/js/ps.js"></script>
  <script>
  (async function () {
    PS.header({});
    PS.footer();
    const root = document.getElementById("root");
    const q = PS.qs();
    const type = q.type === "flight" ? "flight" : "hotel";
    const prebookId = q.prebookId;
    const transactionId = q.transactionId;
    const support = "info@planurstay.com";

    const hero = (icon, cls, h, p) => `<div class="confirm-hero fade-in"><div class="confirm-icon ${cls}">${icon}</div><h1>${h}</h1><p>${p}</p></div>`;

    if (!prebookId) {
      root.innerHTML = hero(PS.icon("alert", 40), "bad", "No booking to show", "If you just paid, check your email or open My trips.") +
        `<div style="text-align:center;margin-top:20px"><a class="btn btn-primary" href="/my-bookings">Go to My trips</a></div>`;
      return;
    }

    const doneKey = "ps_done_" + prebookId;
    const pending = PS.local.get("ps_pending_" + prebookId) || PS.store.get("ps_pending_" + prebookId);

    // Stripe-style redirect params signal a failed or abandoned payment.
    const rs = (q.redirect_status || q.status || "").toLowerCase();
    if (["failed", "canceled", "cancelled", "requires_payment_method"].includes(rs)) {
      root.innerHTML = hero(PS.icon("x", 40, 2.6), "bad", "Payment didn't go through", "You haven't been charged. Please try again or use a different card.") +
        `<div style="text-align:center;margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          ${pending ? `<a class="btn btn-primary" href="${type === "hotel" ? PS.url("/checkout", { type, hotelId: pending.sel?.hotel?.id, offerId: pending.sel?.offer?.offerId }) : PS.url("/checkout", { type })}">Try payment again</a>` : ""}
          <a class="btn btn-ghost" href="/">Back to search</a></div>`;
      return;
    }

    const done = PS.local.get(doneKey);
    if (done) { render(done.booking, done.pending || pending); return; }

    if (!pending) {
      root.innerHTML = hero(PS.icon("info", 40), "pending", "We're finishing your booking", `We couldn't find your booking details in this browser. If you paid, email <a class="link" href="mailto:${support}">${support}</a> with reference <b>${PS.esc(prebookId)}</b> and we'll confirm it for you.`);
      return;
    }

    root.innerHTML = hero(`<span class="spinner" style="width:40px;height:40px;border-width:4px"></span>`, "pending", "Confirming your booking…", `Payment received. We're securing your ${type === "hotel" ? "room with the hotel" : "seats with the airline"}. This usually takes a few seconds, so please keep this page open.`);

    async function book() {
      const h = pending.holder || {};
      if (type === "hotel") {
        const g = pending.guest || h; // the guest checking in (may differ from the booker)
        const r = await PS.api("/api/hotels/book", { method: "POST", body: {
          prebookId, transactionId: transactionId || pending.transactionId,
          guestFirstName: g.firstName, guestLastName: g.lastName, guestEmail: h.email,
          holderFirstName: h.firstName, holderLastName: h.lastName, phone: h.phone || undefined,
          remarks: pending.remarks || undefined,
          voucherCode: pending.voucherCode || undefined,
        }});
        return r.data;
      }
      const r = await PS.api("/api/flights/book", { method: "POST", body: {
        prebookId, payment: { method: "TRANSACTION_ID", transactionId: transactionId || pending.transactionId },
        holder: { firstName: h.firstName, lastName: h.lastName, email: h.email },
        amount: pending.price, currency: pending.currency,
        releaseDate: (pending.sel?.search?.return || pending.sel?.search?.depart || "").slice(0, 10) || undefined,
      }});
      return { ...(r.data || {}), _package: r.package || null };
    }

    let attempt = 0;
    async function run() {
      attempt++;
      try {
        const booking = await book();
        PS.local.set(doneKey, { booking, pending, at: Date.now() });
        render(booking, pending);
      } catch (e) {
        // Timeouts and upstream errors can still mean success on the supplier side; retry a couple of times.
        if (attempt < 3 && (!e.status || e.status >= 500)) { setTimeout(run, 2500 * attempt); return; }
        root.innerHTML = hero(PS.icon("alert", 40), "bad", "We couldn't confirm your booking yet",
          `Your payment was taken, but the ${type === "hotel" ? "hotel" : "airline"} hasn't confirmed. <b>Don't book again.</b> We'll sort it out: email <a class="link" href="mailto:${support}?subject=${encodeURIComponent("Booking " + prebookId)}">${support}</a> with reference <b>${PS.esc(prebookId)}</b>.`) +
          `<div class="confirm-card"><div class="alert error">${PS.icon("info", 18)}<div>${PS.esc(e.message)}</div></div>
           <div style="text-align:center;margin-top:18px"><button class="btn btn-primary" id="retryBtn">Try confirming again</button></div></div>`;
        document.getElementById("retryBtn").onclick = () => { attempt = 0; root.innerHTML = hero(`<span class="spinner" style="width:40px;height:40px;border-width:4px"></span>`, "pending", "Confirming your booking…", "Please keep this page open."); run(); };
      }
    }
    run();

    function render(b, p) {
      b = b || {}; p = p || {};
      const status = String(b.status || "CONFIRMED").toUpperCase();
      const ok = ["CONFIRMED", "SUCCESS", "BOOKED", "TICKETED", "ISSUED"].includes(status);
      const email = p.holder?.email || b.holder?.email || "";
      const cur = b.currency || p.currency || "USD";
      const price = b.price ?? b.pricing?.totalAmount ?? p.price;
      PS.store.del(type === "hotel" ? "ps_hotel_sel" : "ps_flight_sel");

      let details = "";
      if (type === "hotel") {
        const sel = p.sel || {};
        const hotel = sel.hotel || {}, stay = sel.stay || {}, offer = sel.offer || {};
        details = `
          <div class="sum-hotel">${hotel.photo ? `<img src="${PS.esc(hotel.photo)}" alt="">` : ""}<div><div class="stars">${PS.stars(hotel.stars)}</div><h3>${PS.esc(b.hotel?.name || hotel.name || "Your hotel")}</h3><div class="addr">${PS.esc(hotel.address || "")}</div></div></div>
          <div class="divider"></div>
          <div class="sum-lines">
            <div><span>Check-in</span><b>${PS.fmtDay(b.checkin || stay.checkin)}</b></div>
            <div><span>Check-out</span><b>${PS.fmtDay(b.checkout || stay.checkout)}</b></div>
            <div><span>Room</span><b style="text-align:right">${PS.esc(offer.roomName || offer.name || "Room")}</b></div>
            <div><span>Lead guest</span><b>${PS.esc([p.holder?.firstName, p.holder?.lastName].join(" "))}</b></div>
            <div><span>Cancellation</span><b>${offer.refundable ? "Free cancellation" : "Non-refundable"}</b></div>
          </div>
          ${(offer.taxesExcluded || []).length ? `<div class="pay-hotel"><b>${PS.icon("info", 15)}Due at the hotel</b>${offer.taxesExcluded.map(f => `<div><span>${PS.esc(f.description)}</span><span>${PS.money(f.amount, f.currency, 2)}</span></div>`).join("")}<small>Charged by the hotel at check-in or check-out, not included in the amount you paid.</small></div>` : ""}`;
      } else {
        const sel = p.sel || {}, s = sel.search || {};
        details = `
          <h3 style="font-size:18px">${PS.esc(s.fromCity || s.from || "")} → ${PS.esc(s.toCity || s.to || "")}</h3>
          <div class="sum-lines" style="margin-top:12px">
            <div><span>Departure</span><b>${PS.fmtDay(s.depart)}</b></div>
            ${s.return ? `<div><span>Return</span><b>${PS.fmtDay(s.return)}</b></div>` : ""}
            <div><span>Fare</span><b>${PS.esc(PS.fareName(sel.offer?.fare?.family) || "Economy")}</b></div>
            ${(p.services || []).length ? `<div><span>Seats &amp; bags</span><b>${p.services.map(x => PS.esc(x.name || "Extra")).join(", ")}</b></div>` : ""}
            <div><span>Lead traveler</span><b>${PS.esc([p.holder?.firstName, p.holder?.lastName].join(" "))}</b></div>
          </div>`;
      }

      root.innerHTML = hero(ok ? PS.icon("check", 44, 2.6) : PS.icon("clock", 40), ok ? "" : "pending",
          ok ? "You're all set!" : "Booking received",
          ok ? `Your ${type === "hotel" ? "stay" : "flight"} is confirmed${email ? `. We've sent the details to <b>${PS.esc(email)}</b>` : ""}.`
             : `Status: ${PS.esc(status)}. We'll email you as soon as it's confirmed.`) + `
        <div class="confirm-card fade-in">
          <div class="ref-box">
            <div><small>PlanurStay booking ID</small><b>${PS.esc(b.bookingId || b.booking_id || b.liteapi_booking_id || prebookId)}</b></div>
            <div><small>${type === "hotel" ? "Hotel confirmation" : "Airline reference (PNR)"}</small><b>${PS.esc(b.hotelConfirmationCode || b.bookingRef || b.pnr || b.liteapi_booking_ref || "Sent by email")}</b></div>
          </div>
          <div class="panel">
            ${details}
            <div class="divider"></div>
            <div class="sum-total"><span>Total paid</span><b>${PS.money(Number(price), cur, 2)}</b></div>
          </div>
          ${type === "flight" && b._package?.placeId ? `<div class="pkg-cta"><div><span class="pkg-badge">${PS.icon("gift", 14)}Package price unlocked</span>
            <b>Save about <span data-save-pct>${PS.savePct()}</span>% on hotels in ${PS.esc(b._package.city)}</b>
            <p>Because you booked this flight, hotels near ${PS.esc(b._package.airport)} for ${PS.fmtDate(b._package.checkin)} – ${PS.fmtDate(b._package.checkout)} are at package prices. Valid for 30 days.</p></div>
            <a class="btn btn-coral" href="${PS.url("/hotels", { placeId: b._package.placeId, dest: b._package.city, checkin: b._package.checkin, checkout: b._package.checkout, adults: 2, rooms: 1 })}">${PS.icon("bed", 16)}Find a hotel</a></div>`
          : type === "flight" && p.sel?.search?.to ? `<div class="xsell" style="margin-top:18px"><div><b>Need a hotel in ${PS.esc(p.sel.search.toCity || p.sel.search.to)}?</b><p>Book a stay for ${PS.fmtDate(p.sel.search.depart)}${p.sel.search.return ? " – " + PS.fmtDate(p.sel.search.return) : ""}.</p></div><a class="btn btn-white btn-sm" href="${PS.url("/", {})}#stays">${PS.icon("bed", 16)}Find hotels</a></div>` : ""}
          ${extrasHTML(b, p)}
          <div id="insureBox"></div>
          <div id="partnersBox"></div>
          <div id="saveTrip"></div>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px">
            <a class="btn btn-primary" href="/my-bookings">View my trips</a>
            <button class="btn btn-ghost" onclick="window.print()">Print confirmation</button>
          </div>
        </div>`;
      PS.track("booked", { type, value: Number(price) || undefined, currency: cur, id: b.bookingId || b.booking_id || prebookId });
      saveTrip(b);
      insurance(b, p);
      partners(p);
    }

    // Add-ons bought with the booking. LiteAPI returns the Uber voucher link in the booking;
    // we look for it anywhere in the response rather than rely on one field name.
    function extrasHTML(b, p) {
      const ex = p.extras || {};
      if (!ex.uber && !ex.esim) return "";
      const json = JSON.stringify(b || {});
      const uberUrl = (json.match(/https?:\/\/[^"\s]*uber[^"\s]*/i) || [])[0];
      return `${ex.uber ? `<div class="voucher-box"><div><b>${PS.money(ex.uber.value, "USD", 0)} Uber ride credit</b><p>${uberUrl ? "Tap to add it to your Uber account before you travel." : "Your voucher link is included in your confirmation email."}</p></div>${uberUrl ? `<a class="btn btn-white btn-sm" href="${PS.esc(uberUrl)}" target="_blank" rel="noopener">${PS.icon("car", 16)}Claim ride credit</a>` : ""}</div>` : ""}
        ${ex.esim ? `<div class="voucher-box" style="background:var(--blue)"><div><b>eSIM data plan added</b><p>${ex.esim.dataGb != null ? ex.esim.dataGb + " GB" : "Data"}${ex.esim.days ? " for " + ex.esim.days + " days" : ""}. Install instructions (QR code) are sent to your email.</p></div></div>` : ""}`;
    }

    // ─── Protect your trip: Sitata travel insurance, sold inside the page (Sitata takes the payment) ───
    // Pre-filled from the booking; the widget script only loads when the traveller opens it.
    async function insurance(b, p) {
      let cfg;
      try { cfg = await PS.api("/api/insurance/config"); } catch { return; }
      if (!cfg?.enabled) return;
      const box = document.getElementById("insureBox");
      const sel = p.sel || {}, s = sel.search || {}, h = sel.hotel || {}, st = sel.stay || {};
      const start = type === "hotel" ? st.checkin : s.depart, end = type === "hotel" ? st.checkout : (s.return || s.depart);
      if (!start) return;
      const place = type === "hotel" ? (h.city || h.name || "your trip") : (s.toCity || s.to || "your trip");
      const chosen = p.insurance; // the plan they picked at checkout
      box.innerHTML = `<div class="panel insure-panel ${chosen ? "chosen" : ""}">
        <div class="insure-head"><span class="insure-ic">${PS.icon("shield", 22)}</span><div>
          ${chosen ? `<span class="insure-step">One last step</span><h3>Finish adding your travel protection</h3>
            <p>You chose <b>${PS.esc(chosen.name)}</b> (${PS.money(chosen.total, chosen.currency, 2)}). Confirm it and pay Sitata below. It's charged separately from your booking, and your trip is booked either way.</p>`
          : `<h3>Protect your trip to ${PS.esc(place)}</h3>
            <p>Cover for trip cancellation, medical emergencies abroad and lost bags, with 24/7 travel assistance. Get a quote for your dates in a minute.</p>`}</div></div>
        <button class="btn btn-primary" id="insureOpen">${chosen ? "Continue to secure payment" : "See cover options"}</button>
        <div id="insure" class="insure-wdg"></div>
        <p class="price-sub" style="margin-top:10px">Travel insurance is provided and charged by our partner Sitata, separately from your booking. We may earn a commission.</p></div>`;
      document.getElementById("insureOpen").onclick = async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true; btn.innerHTML = `<span class="spinner" style="width:16px;height:16px;border-width:2px;border-color:rgba(255,255,255,.35);border-top-color:#fff"></span>Loading quotes…`;
        PS.track("page", { insurance: 1 });
        // Destination country: the hotel's, or the arrival airport's for flights
        let destCc = type === "hotel" ? h.country : s.toCountry;
        if (!destCc && s.to) { try { destCc = ((await PS.api(`/api/airports?q=${encodeURIComponent(s.to)}`)).data || []).find(a => a.code === s.to)?.countryCode; } catch {} }
        const regionName = (c) => { try { return new Intl.DisplayNames(["en"], { type: "region" }).of(c); } catch { return c; } };
        const iso = (d, endOfDay) => d ? `${String(d).slice(0, 10)}T${endOfDay ? "23:59:59" : "00:00:00"}+00:00` : undefined;
        const trav = p.travellers || [];
        const holder = p.holder || {};
        const price = Number(b.price ?? b.pricing?.totalAmount ?? p.price) || 0;
        const opts = {
          orgId: cfg.orgId, token: cfg.token, merchantOfRecord: false, noQuoteProcess: "assist",
          ...(cfg.chatId ? { chat: { chatId: cfg.chatId } } : {}),
          ...(cfg.contactEmail ? { contactEmail: cfg.contactEmail } : {}),
          priorityOriginCountries: ["CA", "US", "IN", "AE", "GB"],
          ...(s.fromCountry ? { departureCountryCode: String(s.fromCountry).toUpperCase() } : {}),
          user: { name: trav[0]?.name || [holder.firstName, holder.lastName].filter(Boolean).join(" "), email: holder.email || undefined,
            ...(trav[0]?.birthday ? { birthday: trav[0].birthday } : {}), ...(s.fromCountry ? { home_country: String(s.fromCountry).toUpperCase() } : {}) },
          otherTravellers: trav.slice(1).map(t => ({ name: t.name, birthday: t.birthday, relation: 0 })),
          trip: { currency_code: b.currency || p.currency || "USD", start: iso(start), finish: iso(end, true),
            ...(price ? { total_cost: Math.round(price * 100) } : {}), // Sitata takes amounts in cents
            destinations: destCc ? [{ country_code: destCc, friendly_name: regionName(destCc), entry_date: iso(start), exit_date: iso(end, true), type: 0 }] : [] },
        };
        const startWidget = () => {
          try {
            const w = new window.Sitata.insure(document.getElementById("insure"), opts);
            w.run(); btn.remove();
          } catch (err) { btn.disabled = false; btn.textContent = "See cover options"; PS.toast("Insurance quotes couldn't load. Please try again."); }
        };
        if (window.Sitata?.insure) return startWidget();
        document.addEventListener("sitata:insureReady", startWidget, { once: true });
        const sc = document.createElement("script"); sc.async = true; sc.src = "https://www.sitata.com/widgets/sitata-insure.js";
        sc.onerror = () => { btn.disabled = false; btn.textContent = "See cover options"; PS.toast("Insurance quotes couldn't load. Please try again."); };
        document.body.appendChild(sc);
      };
      // They already said yes at checkout: open Sitata's form straight away and bring it into view
      if (chosen) { document.getElementById("insureOpen").click(); setTimeout(() => box.scrollIntoView({ behavior: "smooth", block: "start" }), 600); }
    }

    // Complete your trip: insurance, airport transfer, car hire (partner links configured on the server)
    async function partners(p) {
      let d = {};
      try { d = (await PS.api("/api/partners")).data || {}; } catch { return; }
      const keys = Object.keys(d); if (!keys.length) return;
      const s = p.sel?.search || {}, h = p.sel?.hotel || {}, st = p.sel?.stay || {};
      const ctx = type === "hotel"
        ? { city: h.city || "", country: h.country || "", checkin: st.checkin || "", checkout: st.checkout || "", airport: "" }
        : { city: s.toCity || s.to || "", country: s.toCountry || "", checkin: s.depart || "", checkout: s.return || "", airport: s.to || "" };
      const fill = (u) => u.replace(/\{(city|country|checkin|checkout|airport)\}/g, (_, k) => encodeURIComponent(ctx[k] || ""));
      const ICON = { insurance: "shield", transfers: "car", carHire: "car" };
      document.getElementById("partnersBox").innerHTML = `<div class="panel partners"><h3>Complete your trip</h3><div class="partner-row">${keys.map(k => `
        <a class="partner" href="${PS.esc(fill(d[k].url))}" target="_blank" rel="noopener sponsored">${PS.icon(ICON[k] || "gift", 20)}<div><b>${PS.esc(d[k].title)}</b><small>${PS.esc(d[k].text)}</small></div>${PS.icon("right", 16)}</a>`).join("")}</div>
        <p class="price-sub" style="margin-top:8px">Offered by our partners. We may earn a commission at no extra cost to you.</p></div>`;
    }

    // Guests can attach this booking to an account now or later; signed-in users get it attached automatically.
    async function saveTrip(b) {
      const box = document.getElementById("saveTrip");
      const a = await PS.auth();
      if (a.loggedIn) {
        try {
          await PS.api("/api/trips/claim", { method: "POST", body: { prebookId, bookingId: b.bookingId, email: pending?.holder?.email } });
          box.innerHTML = `<div class="alert success" style="margin-top:18px">${PS.icon("check", 18)}<div>Saved to your account (${PS.esc(a.user.email)}). Find it anytime in My trips.</div></div>`;
        } catch { /* already saved or not yet recorded; nothing to show */ }
        return;
      }
      const back = encodeURIComponent(location.pathname + location.search);
      box.innerHTML = `<div class="panel" style="margin-top:18px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap">
        <div><b style="color:var(--ink)">Save this trip to an account</b><div style="color:var(--text-2);font-size:14px">Manage it anytime and get member prices next time. You can also do this later with your booking ID and email.</div></div>
        <div style="display:flex;gap:8px"><a class="btn btn-sm btn-ghost" href="/login?redirect=${back}">Sign in</a><a class="btn btn-sm btn-primary" href="/login?mode=signup&redirect=${back}">Create account</a></div>
      </div>`;
    }
  })();
  </script>
</body>
</html>
