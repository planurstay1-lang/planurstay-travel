<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My trips — PlanurStay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/ps.css">
</head>
<body>
  <main class="container" style="padding-bottom:40px">
    <div class="page-head"><h1>My trips</h1><p id="who"></p></div>
    <div id="root"><div class="skel" style="height:96px;border-radius:18px;margin-bottom:14px"></div><div class="skel" style="height:84px;border-radius:18px"></div></div>
  </main>

  <script src="/js/ps.js"></script>
  <script>
  (async function () {
    PS.header({ active: "trips" });
    PS.footer();
    const root = document.getElementById("root");
    const auth = await PS.auth();
    const findForm = (title, sub, btnText) => `<div class="panel" style="margin-bottom:22px">
        <h2 style="margin-bottom:4px">${title}</h2><p style="color:var(--text-2);margin-bottom:16px">${sub}</p>
        <form id="findForm" class="form-grid" novalidate>
          <div class="field"><label for="fbId">Booking ID</label><input id="fbId" required placeholder="From your confirmation"></div>
          <div class="field"><label for="fbEmail">Email used at checkout</label><input id="fbEmail" type="email" required></div>
          <div class="full"><button class="btn btn-primary" type="submit">${btnText}</button></div>
        </form><div id="findMsg"></div></div>`;
    const findVals = () => ({ bookingId: document.getElementById("fbId").value.trim(), email: document.getElementById("fbEmail").value.trim() });

    if (!auth.loggedIn) {
      document.getElementById("who").textContent = "Find a booking, or sign in to see all your trips.";
      root.innerHTML = findForm("Find a booking", "Booked as a guest? Enter your booking ID and email to see it.", "Find booking") +
        `<div class="empty"><div class="ei">${PS.icon("trips", 28)}</div><h3>Keep all your trips in one place</h3><p>Sign in or create a free account. Bookings you made as a guest can be added to it.</p><a class="btn btn-primary" href="${PS.loginUrl()}">Sign in</a></div>`;
      document.getElementById("findForm").onsubmit = async (e) => {
        e.preventDefault();
        const m = document.getElementById("findMsg"), v = findVals();
        if (!v.bookingId || !v.email) { m.innerHTML = `<div class="alert error" style="margin-top:14px">${PS.icon("alert", 18)}<div>Enter both your booking ID and email.</div></div>`; return; }
        try {
          const t = (await PS.api(`/api/trips/lookup?bookingId=${encodeURIComponent(v.bookingId)}&email=${encodeURIComponent(v.email)}`)).data;
          m.innerHTML = `<div class="trip" style="margin-top:16px"><div class="trip-ico">${PS.icon("bed", 24)}</div><div class="trip-main"><h3>${PS.esc(t.name)}</h3><p>${PS.fmtDay(t.checkin)} – ${PS.fmtDay(t.checkout)} · ${PS.esc(t.guest || "")}</p></div><div class="trip-right"><div style="font-weight:800;color:var(--ink)">${t.price ? PS.money(Number(t.price), t.currency || "USD", 0) : ""}</div><span class="status ok">${PS.esc(t.status || "")}</span></div></div>
            <p class="price-sub">Want to manage it with your other trips? <a class="link" href="/login?mode=signup&redirect=/my-bookings">Create an account</a> and add it with the same details.</p>`;
        } catch (err) { m.innerHTML = `<div class="alert error" style="margin-top:14px">${PS.icon("alert", 18)}<div>${PS.esc(err.message)}</div></div>`; }
      };
      return;
    }
    const u = auth.user, l = u.loyalty || {};
    document.getElementById("who").textContent = `Signed in as ${u.email}`;

    let trips = [];
    try { trips = (await PS.api("/api/trips")).data || []; } catch (e) {
      root.innerHTML = `<div class="alert error">${PS.icon("alert", 18)}<div>We couldn't load your trips. ${PS.esc(e.message)}</div></div>`; return;
    }
    const today = PS.iso(PS.today());
    const upcoming = trips.filter(t => (t.checkin || "") >= today);
    const past = trips.filter(t => (t.checkin || "") < today);

    const tripHTML = (t) => {
      const s = String(t.status || "").toUpperCase();
      const cls = ["CONFIRMED", "BOOKED", "TICKETED"].includes(s) ? "ok" : /CANCEL|FAIL/.test(s) ? "bad" : "pend";
      return `<div class="trip">
        <div class="trip-ico">${PS.icon(t.type === "flight" ? "plane" : "bed", 24)}</div>
        <div class="trip-main">
          <h3>${PS.esc(t.name || (t.type === "flight" ? "Flight" : "Hotel stay"))}</h3>
          <p>${t.checkin ? PS.fmtDay(t.checkin) : ""}${t.checkout ? " – " + PS.fmtDay(t.checkout) : ""}${t.guest ? " · " + PS.esc(t.guest) : ""}</p>
          <p style="font-size:12.5px;color:var(--muted)">Booking ID ${PS.esc(t.bookingId || t.id)}${t.pnr ? " · PNR " + PS.esc(t.pnr) : ""}</p>
        </div>
        <div class="trip-right">
          <div style="font-weight:800;color:var(--ink)">${t.price ? PS.money(Number(t.price), t.currency || "USD", 0) : ""}</div>
          <span class="status ${cls}">${PS.esc(s || "PENDING")}</span>
        </div>
      </div>`;
    };

    root.innerHTML = `
      <div class="stat-row">
        <div class="stat loyal"><small>Points balance</small><b>${(l.points || 0).toLocaleString()}</b><span style="font-size:13px;opacity:.8">${PS.esc(l.tierLabel || "Explorer")} tier · ${l.earnRate || 5} pts per $1</span></div>
        <div class="stat"><small>Lifetime points</small><b>${(l.lifetime || 0).toLocaleString()}</b></div>
        <div class="stat"><small>Trips booked</small><b>${trips.length}</b></div>
      </div>
      <div class="panel" style="margin-bottom:22px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <div><h2 style="margin:0 0 4px">Redeem points</h2><p style="color:var(--text-2)">Turn 500 points into $5 off your next booking.</p></div>
          <div style="display:flex;gap:8px;align-items:center">
            <div class="field"><select id="redeemPts" aria-label="Points to redeem">${[500, 1000, 1500, 2000, 2500, 5000].map(p => `<option value="${p}" ${p > (l.points || 0) ? "disabled" : ""}>${p.toLocaleString()} pts → $${p / 100} off</option>`).join("")}</select></div>
            <button class="btn btn-primary" id="redeemBtn" ${(l.points || 0) < 500 ? "disabled" : ""}>Redeem</button>
          </div>
        </div>
        <div id="redeemMsg"></div>
      </div>
      <h2 style="font-size:21px;margin-bottom:12px">Upcoming</h2>
      ${upcoming.length ? upcoming.map(tripHTML).join("") : `<div class="empty" style="padding:36px 20px"><div class="ei">${PS.icon("globe", 26)}</div><h3>No upcoming trips</h3><p>Your next adventure is a search away.</p><div style="display:flex;gap:8px;justify-content:center"><a class="btn btn-primary" href="/#stays">Find a stay</a><a class="btn btn-ghost" href="/#flights">Find a flight</a></div></div>`}
      ${past.length ? `<h2 style="font-size:21px;margin:28px 0 12px">Past trips</h2>${past.map(tripHTML).join("")}` : ""}
      <div style="margin-top:28px">${findForm("Add a guest booking", "Booked without signing in? Add it to this account with your booking ID and checkout email.", "Add to my trips")}</div>
      <p class="price-sub" style="margin-top:22px">Need to change or cancel? Email <a class="link" href="mailto:info@planurstay.com">info@planurstay.com</a> with your booking ID.</p>`;

    document.getElementById("findForm").onsubmit = async (e) => {
      e.preventDefault();
      const m = document.getElementById("findMsg"), v = findVals();
      if (!v.bookingId || !v.email) { m.innerHTML = `<div class="alert error" style="margin-top:14px">${PS.icon("alert", 18)}<div>Enter both your booking ID and email.</div></div>`; return; }
      try {
        await PS.api("/api/trips/claim", { method: "POST", body: v });
        m.innerHTML = `<div class="alert success" style="margin-top:14px">${PS.icon("check", 18)}<div>Added to your trips. Refreshing…</div></div>`;
        setTimeout(() => location.reload(), 900);
      } catch (err) { m.innerHTML = `<div class="alert error" style="margin-top:14px">${PS.icon("alert", 18)}<div>${PS.esc(err.message)}</div></div>`; }
    };

    const rb = document.getElementById("redeemBtn");
    rb.onclick = async () => {
      rb.disabled = true;
      const m = document.getElementById("redeemMsg");
      try {
        const r = await PS.api("/api/loyalty/redeem", { method: "POST", body: { points: +document.getElementById("redeemPts").value } });
        m.innerHTML = `<div class="alert success" style="margin-top:14px">${PS.icon("check", 18)}<div><b>Voucher created: <span style="font-family:ui-monospace,Menlo,monospace">${PS.esc(r.data.voucherCode)}</span></b><br>Enter this code at checkout for $${r.data.discountUsd} off. New balance: ${(r.data.newBalance || 0).toLocaleString()} pts.</div></div>`;
      } catch (e) {
        rb.disabled = false;
        m.innerHTML = `<div class="alert error" style="margin-top:14px">${PS.icon("alert", 18)}<div>${PS.esc(e.message)}</div></div>`;
      }
    };
  })();
  </script>
</body>
</html>
