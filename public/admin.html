<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Revenue — PlanurStay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/ps.css">
  <style>
    .ad-bar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:18px}
    .ad-bar .field{margin:0}
    .ad-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
    .ad-kpi{background:#fff;border:1px solid var(--line,#e6e8ee);border-radius:14px;padding:14px 16px}
    .ad-kpi small{display:block;color:var(--text-2);font-size:12.5px;font-weight:600}
    .ad-kpi b{display:block;font-size:22px;margin-top:4px}
    .ad-kpi span{color:var(--text-2);font-size:12px}
    .ad-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
    @media (max-width:860px){.ad-grid{grid-template-columns:1fr}}
    .ad-card{background:#fff;border:1px solid var(--line,#e6e8ee);border-radius:14px;padding:16px;margin-bottom:14px;overflow-x:auto}
    .ad-card h3{font-size:15px;margin-bottom:10px}
    .ad-t{width:100%;border-collapse:collapse;font-size:13.5px}
    .ad-t th{text-align:left;color:var(--text-2);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line,#e6e8ee)}
    .ad-t td{padding:7px 8px;border-bottom:1px solid #f1f2f5;white-space:nowrap}
    .ad-t td.n,.ad-t th.n{text-align:right}
    .bars{display:flex;align-items:end;gap:6px;height:130px;padding-top:6px}
    .bars div{flex:1;background:var(--brand,#0b6bcb);border-radius:6px 6px 0 0;min-height:2px;position:relative}
    .bars div span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--text-2)}
    .good{color:#0a7d46}.bad{color:#c0362c}
  </style>
</head>
<body>
  <main class="container" style="padding-bottom:40px">
    <div class="page-head"><h1>Revenue</h1><p>Bookings, commission and pricing headroom.</p></div>
    <div id="root"><div class="skel" style="height:96px;border-radius:18px"></div></div>
  </main>

  <script src="/js/ps.js"></script>
  <script>
  (async function () {
    PS.header({});
    PS.footer();
    const root = document.getElementById("root");
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const me = await fetch("/api/admin/me").then(r => r.json()).catch(() => ({}));
    if (!me.admin) {
      const why = !me.signedIn ? "Sign in with an admin account."
        : !me.adminListSet ? `You're signed in as <b>${esc(me.email)}</b>, but no admins are set up on the server. On Render → Environment, add <code>ADMIN_EMAILS</code> = <code>${esc(me.email)}</code>, save, and wait for the redeploy.`
        : `You're signed in as <b>${esc(me.email)}</b>, which isn't on the admin list. Check <code>ADMIN_EMAILS</code> on Render matches this email exactly.`;
      root.innerHTML = `<div class="empty"><h3>Admins only</h3><p>${why}</p>${me.signedIn ? "" : `<a class="btn btn-primary" href="${PS.loginUrl()}">Sign in</a>`}</div>`;
      return;
    }
    const iso = (d) => d.toISOString().slice(0, 10);
    root.innerHTML = `
      <div id="suppliers"></div>
      <div id="smart"></div>
      <div class="ad-bar">
        <div class="field"><label>From</label><input type="date" id="from" value="${iso(new Date(Date.now() - 30 * 864e5))}"></div>
        <div class="field"><label>To</label><input type="date" id="to" value="${iso(new Date())}"></div>
        <button class="btn btn-primary" id="go">Update</button>
      </div>
      <div id="ov"></div>
      <div class="ad-card"><h3>Pricing headroom</h3>
        <p style="color:var(--text-2);font-size:13px;margin-bottom:10px">Compares the net rate, the hotel's suggested selling price (SSP) and our public price. SSP ÷ net shows how much markup is possible before public prices undercut the hotel.</p>
        <div class="ad-bar"><div class="field"><label>City</label><input id="pq" value="New York"></div><button class="btn" id="pgo">Run probe</button></div>
        <div id="probe"></div>
      </div>`;
    const money = (n, c) => PS.money(+n || 0, c || "USD");

    async function load() {
      const ov = document.getElementById("ov");
      const dbWarn = d.database && !d.database.persistent ? `<div class="ad-card" style="border-color:#f3c3bd;background:#fff6f5"><h3 class="bad">Database is not on the persistent disk</h3><p style="font-size:13.5px">${esc(d.database.error || "DB_PATH is not set")}. Accounts, bookings, tickets and settings will be erased on the next deploy. On Render, check Disk → mount path is exactly the folder in DB_PATH (e.g. /var/data).</p></div>` : "";
      ov.innerHTML = dbWarn + `<div class="skel" style="height:96px;border-radius:14px"></div>`;
      const q = new URLSearchParams({ from: document.getElementById("from").value, to: document.getElementById("to").value });
      const d = await fetch("/api/admin/overview?" + q).then(r => r.json()).catch(() => null);
      if (!d || !d.success) { ov.innerHTML = `<div class="panel">Could not load analytics.</div>`; return; }
      const L = d.liteapi, S = d.site, cur = L.totals.currency || "USD";
      const take = L.totals.sales ? (100 * L.totals.commission / L.totals.sales).toFixed(1) + "% of sales" : "";
      const maxW = Math.max(1, ...L.weekly.map(w => w.sales));
      ov.innerHTML = `
        <div class="ad-kpis">
          <div class="ad-kpi"><small>Sales</small><b>${money(L.totals.sales, cur)}</b><span>${L.totals.bookings} bookings</span></div>
          <div class="ad-kpi"><small>Commission earned</small><b class="good">${money(L.totals.commission, cur)}</b><span>${take}</span></div>
          <div class="ad-kpi"><small>Avg booking</small><b>${money(L.totals.bookings ? L.totals.sales / L.totals.bookings : 0, cur)}</b><span>per booking</span></div>
          <div class="ad-kpi"><small>Rewards owed</small><b class="bad">${money(S.rewards.liabilityUsd)}</b><span>${S.rewards.pointsAvailable.toLocaleString()} pts + ${S.rewards.pointsPending.toLocaleString()} pending</span></div>
          <div class="ad-kpi"><small>Members</small><b>${S.users}</b><span>${S.memberBookings} member bookings</span></div>
          <div class="ad-kpi"><small>Audience</small><b>${S.newsletter}</b><span>newsletter · ${S.priceAlerts} price alerts</span></div>
        </div>
        <div class="ad-card"><h3>Hotel markup</h3>
          <p style="color:var(--text-2);font-size:13px;margin-bottom:10px">Our commission on top of the hotel's net rate. Changes apply to new searches within a few minutes. Members currently save <b>${d.pricing.memberSavePct}%</b>. Below-SSP gate: <b>${d.pricing.parityGate ? "on" : "off"}</b>. Free-cancellation rates get extra points on top (like Expedia: the non-refundable rate stays the cheap headline price).</p>
          <form id="mkForm" class="ad-bar" style="margin:0">
            <div class="field"><label>Guests %</label><input id="mkPub" type="number" min="0" max="40" step="0.5" value="${d.pricing.publicMargin}" style="width:110px"></div>
            <div class="field"><label>Members %</label><input id="mkMem" type="number" min="0" max="40" step="0.5" value="${d.pricing.memberMargin}" style="width:110px"></div>
            <div class="field"><label>Free cancellation +%</label><input id="mkFlex" type="number" min="0" max="30" step="0.5" value="${d.pricing.flexExtra ?? 6}" style="width:130px" title="Extra points on free-cancellation rates"></div>
            <button class="btn btn-primary" type="submit">Save</button><span id="mkMsg" style="font-size:13px;align-self:center"></span>
          </form></div>
        <div id="tickets"></div>
        <div id="traffic"></div>
        <div class="ad-grid">
          <div class="ad-card"><h3>Weekly sales</h3><div class="bars">${L.weekly.map(w => `<div style="height:${(100 * w.sales / maxW).toFixed(1)}%" title="${esc(w.weeks)}: ${money(w.sales, cur)}"><span>${esc(String(w.weeks).replace("week ", "W"))}</span></div>`).join("")}</div><div style="height:18px"></div></div>
          <div class="ad-card"><h3>Markets</h3><table class="ad-t"><tr><th>Guest country</th><th class="n">Bookings</th><th class="n">Sales</th></tr>
            ${L.markets.map(m => `<tr><td>${esc(m.nationality)}</td><td class="n">${m.totalBooking}</td><td class="n">${money(m.sales, m.currency)}</td></tr>`).join("") || `<tr><td colspan="3">No data</td></tr>`}</table></div>
        </div>
        <div class="ad-grid">
          <div class="ad-card"><h3>Top hotels</h3><table class="ad-t"><tr><th>Hotel</th><th>City</th><th class="n">Bookings</th><th class="n">Sales</th></tr>
            ${L.hotels.map(h => `<tr><td>${esc(h.name)}</td><td>${esc(h.city)}</td><td class="n">${h.total}</td><td class="n">${money(h.sales, h.currency)}</td></tr>`).join("") || `<tr><td colspan="4">No data</td></tr>`}</table></div>
          <div class="ad-card"><h3>Daily</h3><table class="ad-t"><tr><th>Date</th><th class="n">Bookings</th><th class="n">Sales</th><th class="n">Commission</th></tr>
            ${L.daily.map(x => `<tr><td>${x.date}</td><td class="n">${x.bookings}</td><td class="n">${money(x.sales, cur)}</td><td class="n">${money(x.commission, cur)}</td></tr>`).join("") || `<tr><td colspan="4">No data</td></tr>`}</table></div>
        </div>
        <div class="ad-card"><h3>Recent site bookings</h3><table class="ad-t"><tr><th>Hotel</th><th>Check-in</th><th>Who</th><th>Status</th><th class="n">Price</th></tr>
          ${S.recent.map(b => `<tr><td>${esc(b.name)}</td><td>${esc(b.checkin)}</td><td>${b.who}</td><td>${esc(b.status)}</td><td class="n">${money(b.price, b.currency)}</td></tr>`).join("") || `<tr><td colspan="5">No bookings yet</td></tr>`}</table></div>`;
      traffic();
      tickets();
    }

    async function tickets() {
      const el = document.getElementById("tickets"); if (!el) return;
      const t = await fetch("/api/admin/tickets").then(r => r.json()).catch(() => null);
      if (!t || !t.success) return;
      const open = t.data.filter(x => x.status === "open");
      el.innerHTML = `<div class="ad-card"><h3>Support tickets <small style="color:var(--text-2);font-weight:600">${open.length} open</small></h3>
        <table class="ad-t"><tr><th>Ref</th><th>When</th><th>Customer</th><th>Booking</th><th>Type</th><th>Request</th><th></th></tr>
        ${t.data.slice(0, 40).map(x => `<tr style="${x.status === "closed" ? "opacity:.55" : ""}"><td><b>${esc(x.ref)}</b></td><td>${esc(String(x.created_at).slice(0, 16))}</td><td><a href="mailto:${esc(x.email)}?subject=${encodeURIComponent("Re: " + x.ref)}">${esc(x.email)}</a></td><td>${esc(x.booking_id || "–")}</td><td>${esc(x.category)}</td>
          <td style="white-space:normal;min-width:260px">${esc(x.summary)}</td><td>${x.status === "open" ? `<button class="btn btn-sm" data-close="${esc(x.ref)}">Close</button>` : "closed"}</td></tr>`).join("") || `<tr><td colspan="7">No tickets yet</td></tr>`}</table></div>`;
      el.querySelectorAll("[data-close]").forEach(b => b.onclick = async () => {
        await fetch("/api/admin/tickets/" + encodeURIComponent(b.dataset.close), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: "closed" }) });
        tickets();
      });
    }

    async function traffic() {
      const el = document.getElementById("traffic"); if (!el) return;
      const q = new URLSearchParams({ from: document.getElementById("from").value, to: document.getElementById("to").value });
      const t = await fetch("/api/admin/traffic?" + q).then(r => r.json()).catch(() => null);
      if (!t || !t.success) { el.innerHTML = ""; return; }
      const top = Math.max(1, t.funnel[0].n);
      const maxD = Math.max(1, ...t.daily.map(x => x.visitors));
      const names = { home: "Home", hotel_results: "Hotel results", hotel_view: "Hotel page", flight_results: "Flight results", flight_view: "Flight details", checkout: "Checkout", booked: "Booked", guides: "Guides", guide: "Guide page", rewards: "Rewards", trips: "My trips", login: "Sign in", legal: "Legal pages", page: "Other" };
      el.innerHTML = `
        <div class="ad-kpis">
          <div class="ad-kpi"><small>Visitors</small><b>${t.totals.visitors}</b><span>${t.totals.sessions} visits</span></div>
          <div class="ad-kpi"><small>Page views</small><b>${t.totals.views}</b><span>${t.totals.visitors ? (t.totals.views / t.totals.visitors).toFixed(1) : 0} per visitor</span></div>
          <div class="ad-kpi"><small>Conversion</small><b>${t.funnel[0].n ? (100 * t.funnel[4].n / t.funnel[0].n).toFixed(2) : "0.00"}%</b><span>visitors who booked</span></div>
        </div>
        <div class="ad-grid">
          <div class="ad-card"><h3>Booking funnel</h3>${t.funnel.map((f, i) => `
            <div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:13.5px"><span>${f.label}</span><span><b>${f.n}</b>${i ? ` <small style="color:var(--text-2)">· ${t.funnel[i - 1].n ? Math.round(100 * f.n / t.funnel[i - 1].n) : 0}% of previous</small>` : ""}</span></div>
            <div style="height:8px;border-radius:6px;background:#eef1f6;margin-top:4px"><div style="height:100%;width:${(100 * f.n / top).toFixed(1)}%;background:var(--brand,#0b6bcb);border-radius:6px"></div></div></div>`).join("")}</div>
          <div class="ad-card"><h3>Daily visitors</h3><div class="bars">${t.daily.map(x => `<div style="height:${(100 * x.visitors / maxD).toFixed(1)}%" title="${x.day}: ${x.visitors} visitors"><span>${x.day.slice(8)}</span></div>`).join("") || "<p>No visits yet</p>"}</div><div style="height:18px"></div></div>
        </div>
        <div class="ad-grid">
          <div class="ad-card"><h3>Top searches</h3><table class="ad-t"><tr><th>Destination</th><th class="n">Searches</th></tr>${t.searches.map(x => `<tr><td>${esc(x.dest)}</td><td class="n">${x.n}</td></tr>`).join("") || `<tr><td colspan="2">No searches yet</td></tr>`}</table></div>
          <div class="ad-card"><h3>Where visitors come from</h3><table class="ad-t"><tr><th>Site</th><th class="n">Visitors</th></tr>${t.referrers.map(x => `<tr><td>${esc(x.ref)}</td><td class="n">${x.visitors}</td></tr>`).join("") || `<tr><td colspan="2">Direct visits only so far</td></tr>`}</table>
            <p style="font-size:12.5px;color:var(--text-2);margin-top:8px">${t.devices.map(x => `${esc(x.device)}: ${x.visitors}`).join(" · ")}</p></div>
        </div>
        <div class="ad-card"><h3>Pages</h3><table class="ad-t"><tr><th>Page</th><th class="n">Views</th><th class="n">Visitors</th></tr>${t.pages.map(x => `<tr><td>${names[x.event] || esc(x.event)}</td><td class="n">${x.views}</td><td class="n">${x.visitors}</td></tr>`).join("")}</table></div>`;
    }

    async function probe() {
      const el = document.getElementById("probe");
      el.innerHTML = `<div class="skel" style="height:60px;border-radius:12px"></div>`;
      const d = await fetch("/api/admin/pricing-probe?q=" + encodeURIComponent(document.getElementById("pq").value)).then(r => r.json()).catch(() => null);
      if (!d || !d.success) { el.innerHTML = `<p class="bad">${esc(d?.error || "Probe failed")}</p>`; return; }
      const s = d.summary, pct = (x) => x == null ? "–" : ((x - 1) * 100).toFixed(1) + "%";
      el.innerHTML = `
        <p style="font-size:13.5px;margin-bottom:10px">${d.hotels} hotels · ${d.checkin} → ${d.checkout}<br>
          Median SSP over net: <b>${pct(s.medianSspOverNet)}</b> · Our public price vs SSP (median): <b>${pct(s.medianPublicOverSsp)}</b> at ${d.publicMargin}% margin<br>
          Hotels where SSP changes with our margin: <b>${s.sspMovesWithMargin}/${d.hotels}</b> (so SSP at our margin isn't a real floor)<br>
          <b>Guest prices now:</b> ${s.pricedAtHotelPrice}/${d.hotels} hotels priced up to the hotel's own price · below the hotel's price: <b class="${s.guestBelowHotelPrice ? "bad" : "good"}">${s.guestBelowHotelPrice}</b> · average guest margin <b>${s.avgGuestMargin}%</b></p>
        <table class="ad-t"><tr><th>Hotel</th><th class="n">Net</th><th class="n">SSP</th><th class="n">SSP/net</th><th class="n">Public</th><th class="n">SSP @ public</th><th class="n">Public vs SSP</th><th class="n">Guest price now</th><th class="n">Margin</th></tr>
        ${d.rows.map(r => `<tr><td>${esc(r.hotelId)}</td><td class="n">${money(r.net)}</td><td class="n">${money(r.sspAtMargin0)}</td><td class="n">${pct(r.sspOverNet)}</td><td class="n">${money(r.publicTotal)}</td><td class="n">${money(r.sspAtPublicMargin)}</td><td class="n ${r.publicOverSsp < 0.995 ? "bad" : "good"}">${pct(r.publicOverSsp)}</td><td class="n"><b>${money(r.guestPrice)}</b></td><td class="n">${r.guestMargin}%</td></tr>`).join("")}</table>`;
    }
    // ─── Supplier switches: close out any supplier instantly (search, rooms and checkout); bookings already made stay ───
    async function loadSuppliers(data) {
      const box = document.getElementById("suppliers");
      const d = data || await fetch("/api/admin/suppliers").then(r => r.json()).catch(() => null);
      if (!d?.suppliers) { box.innerHTML = ""; return; }
      const groups = [...new Set(d.suppliers.map(x => x.group))];
      box.innerHTML = `<div class="ad-card" style="margin-bottom:18px"><h3>Suppliers</h3>
        <p style="color:var(--text-2);font-size:13px;margin-bottom:12px">Switch a supplier off to stop selling it right away: its hotels, rooms, fares or cars disappear from search and checkout on the next search. Bookings already made aren't affected.</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">${groups.map(g => `<div><b style="font-size:13px;color:var(--text-2)">${esc(g)}</b>
          ${d.suppliers.filter(x => x.group === g).map(x => `<label style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line,#eee);cursor:pointer">
            <span>${esc(x.label)}${x.via ? ` <small style="color:var(--text-2)">via ${esc(x.via)}</small>` : ""}<br><small class="${x.off ? "bad" : "good"}" style="font-weight:700">${x.off ? "Off: not sold" : "On"}</small></span>
            <input type="checkbox" data-sup="${esc(x.key)}" ${x.off ? "" : "checked"} style="width:20px;height:20px"></label>`).join("")}</div>`).join("")}</div>
        <div id="supMsg" style="font-size:13px;margin-top:10px"></div></div>`;
    }
    document.addEventListener("change", async (e) => {
      const key = e.target.dataset?.sup; if (!key) return;
      const on = e.target.checked, label = e.target.closest("label").querySelector("span").firstChild.textContent.trim();
      if (!confirm(on ? `Switch ${label} back on? It will be sold again from the next search.` : `Switch ${label} off? It stops being sold immediately.`)) { e.target.checked = !on; return; }
      const r = await fetch("/api/admin/suppliers", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key, off: !on }) }).then(r => r.json()).catch(() => ({ error: "Network error" }));
      if (!r.success) { e.target.checked = !on; document.getElementById("supMsg").innerHTML = `<span class="bad">${esc(r.error)}</span>`; return; }
      await loadSuppliers(r);
      document.getElementById("supMsg").innerHTML = `<span class="good">${esc(label)} is now ${on ? "on" : "off"}.</span>`;
    });
    loadSuppliers();

    // ─── Smart pricing & safety: market pricing, card safety, ready searches ───
    const num = (id, v, step = 0.5, w = 96) => `<input id="${id}" type="number" min="0" step="${step}" value="${esc(v)}" style="width:${w}px">`;
    const fld = (label, input, hint) => `<div class="field"><label${hint ? ` title="${esc(hint)}"` : ""}>${label}</label>${input}</div>`;
    async function loadSmart(data) {
      const box = document.getElementById("smart");
      const d = data || await fetch("/api/admin/smart").then(r => r.json()).catch(() => null);
      if (!d?.market) { box.innerHTML = ""; return; }
      const m = d.market.settings, ms = d.market.stats, f = d.fraud.settings, w = d.prewarm;
      const statLine = (k, label) => ms[k].repriced ? `${label}: ${ms[k].repriced} priced to market since restart, average margin <b>${ms[k].avgMargin}%</b> (${ms[k].raised} above the flat markup, ${ms[k].lowered} below to win the sale).` : `${label}: none priced to market since restart.`;
      box.innerHTML = `
      <div class="ad-card" style="margin-bottom:18px"><h3>Market pricing (Travellez hotels &amp; flights)</h3>
        <p style="color:var(--text-2);font-size:13px;margin-bottom:10px">When LiteAPI sells the same hotel or flight, we price just under its guest price instead of a flat markup: more margin where our cost is low, a smaller one where that wins the sale. Never below the minimum or above the maximum; with nothing to compare, the flat markup applies.</p>
        <form id="mpForm" class="ad-bar" style="margin:0;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:8px;font-weight:600"><input type="checkbox" id="mpOn" ${m.on ? "checked" : ""} style="width:18px;height:18px"> On</label>
          ${fld("Hotels min %", num("mpHMin", m.hotelMin))}${fld("Hotels max %", num("mpHMax", m.hotelMax))}${fld("Hotels under market %", num("mpHU", m.hotelUndercut, 0.25), "How far below LiteAPI's guest price we sell")}
          ${fld("Flights min %", num("mpFMin", m.flightMin))}${fld("Flights max %", num("mpFMax", m.flightMax))}${fld("Flights under market %", num("mpFU", m.flightUndercut, 0.25))}
          <button class="btn btn-primary" type="submit">Save</button>
        </form>
        <p style="font-size:13px;color:var(--text-2);margin-top:10px">${statLine("hotel", "Hotels")}<br>${statLine("flight", "Flights")}</p>
        <div id="mpMsg" style="font-size:13px"></div></div>
      <div class="ad-card" style="margin-bottom:18px"><h3>Card safety</h3>
        <p style="color:var(--text-2);font-size:13px;margin-bottom:10px">For bookings PlanurStay pays for (Travellez flights, hotels, cars). Above the 3D Secure amount the customer confirms with their bank. After the card is approved, Stripe Radar's verdict is checked before we book: highest risk is never booked; elevated risk only with 3D Secure. Held-back bookings release the card and email support. All amounts in USD; 0 turns a limit off.</p>
        <form id="fsForm" class="ad-bar" style="margin:0;flex-wrap:wrap">
          ${fld("3D Secure above $", num("fs3ds", f.threeDsAboveUsd, 10, 110))}
          ${fld("Elevated risk: block above $", num("fsEl", f.elevatedAboveUsd, 10, 110), "0 = block every elevated-risk payment without 3D Secure")}
          ${fld("Per customer / day $", num("fsCust", f.customerDailyUsd, 50, 110))}
          ${fld("Per customer / day bookings", num("fsCnt", f.customerDailyBookings, 1, 90))}
          ${fld("Whole site / day $", num("fsTot", f.dailyTotalUsd, 100, 120))}
          <button class="btn btn-primary" type="submit">Save</button>
        </form>
        <p style="font-size:13px;color:var(--text-2);margin-top:10px">Held back for card risk in the last 30 days: <b>${d.fraud.heldBack30d}</b>.</p>
        <div id="fsMsg" style="font-size:13px"></div></div>
      ${w ? `<div class="ad-card" style="margin-bottom:18px"><h3>Ready searches</h3>
        <p style="color:var(--text-2);font-size:13px;margin-bottom:10px">Travellez hotel search takes 30–40 seconds. Every ${w.everyMin} minutes (6:00–1:00 Toronto time) we run the most likely searches in the background (top destinations at the search form's default dates, plus searches people repeat) so customers get Travellez hotels instantly. Hotel pages and checkout always re-check the live price.</p>
        <div class="ad-bar" style="margin:0">
          <label style="display:flex;align-items:center;gap:8px;font-weight:600"><input type="checkbox" id="pwOn" ${w.on ? "checked" : ""} style="width:18px;height:18px"> On</label>
          <button class="btn" id="pwRun" type="button" ${w.running ? "disabled" : ""}>${w.running ? "Running…" : "Run now"}</button>
          <span style="font-size:13px;align-self:center">${w.active ? "" : w.on ? `<span class="bad">Waiting: Travellez hotels aren't switched on.</span> ` : ""}Served instantly today: <b>${w.servedToday}</b></span>
        </div>
        <table class="ad-t" style="margin-top:12px"><tr><th>Ready now</th><th>Dates</th><th class="n">Hotels</th><th class="n">Took</th></tr>
          ${w.ready.length ? w.ready.map(r => `<tr><td>${esc(r.dest)} <small>${esc(r.currency)}</small></td><td>${esc(r.checkin)} → ${esc(r.checkout)}</td><td class="n">${r.hotels}</td><td class="n">${Math.round(r.ms / 1000)}s</td></tr>`).join("")
            : `<tr><td colspan="4" style="color:var(--text-2)">Nothing yet. ${w.next.length ? `Next: ${w.next.map(n => esc(n.dest)).join(", ")}.` : "Destinations appear once customers search."}</td></tr>`}</table>
        <div id="pwMsg" style="font-size:13px"></div></div>` : ""}`;
    }
    const postSmart = async (url, body, msgId, ok) => {
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(r => r.json()).catch(() => ({ error: "Network error" }));
      if (r.success) { await loadSmart(r); document.getElementById(msgId).innerHTML = `<span class="good">${ok}</span>`; }
      else document.getElementById(msgId).innerHTML = `<span class="bad">${esc(r.error)}</span>`;
    };
    document.addEventListener("submit", (e) => {
      const v = (id) => document.getElementById(id).value;
      if (e.target.id === "mpForm") {
        e.preventDefault();
        if (!confirm("Save market pricing? This changes live prices on the next search.")) return;
        postSmart("/api/admin/market", { on: document.getElementById("mpOn").checked, hotelMin: v("mpHMin"), hotelMax: v("mpHMax"), hotelUndercut: v("mpHU"), flightMin: v("mpFMin"), flightMax: v("mpFMax"), flightUndercut: v("mpFU") }, "mpMsg", "Saved.");
      } else if (e.target.id === "fsForm") {
        e.preventDefault();
        postSmart("/api/admin/fraud", { threeDsAboveUsd: v("fs3ds"), elevatedAboveUsd: v("fsEl"), customerDailyUsd: v("fsCust"), customerDailyBookings: v("fsCnt"), dailyTotalUsd: v("fsTot") }, "fsMsg", "Saved.");
      }
    });
    document.addEventListener("change", (e) => {
      if (e.target.id === "pwOn") postSmart("/api/admin/prewarm", { on: e.target.checked }, "pwMsg", e.target.checked ? "Ready searches on." : "Ready searches off.");
    });
    document.addEventListener("click", (e) => {
      if (e.target.id === "pwRun") postSmart("/api/admin/prewarm", { runNow: true }, "pwMsg", "Started. Each search takes 30–40 seconds; reload in a few minutes.");
    });
    loadSmart();
    document.getElementById("go").onclick = load;
    document.addEventListener("submit", async (e) => {
      if (e.target.id !== "mkForm") return;
      e.preventDefault();
      const msg = document.getElementById("mkMsg");
      const pub = document.getElementById("mkPub").value, mem = document.getElementById("mkMem").value, flex = document.getElementById("mkFlex").value;
      if (!confirm(`Set guest markup to ${pub}%, member markup to ${mem}% and +${flex}% on free-cancellation rates? This changes live prices.`)) return;
      const r = await fetch("/api/admin/pricing", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ publicMargin: pub, memberMargin: mem, flexExtra: flex }) }).then(r => r.json()).catch(() => ({ error: "Network error" }));
      msg.innerHTML = r.success ? `<span class="good">Saved. Members now save ${r.memberSavePct}%.</span>` : `<span class="bad">${esc(r.error)}</span>`;
    });
    document.getElementById("pgo").onclick = probe;
    load();
  })();
  </script>
</body>
</html>
