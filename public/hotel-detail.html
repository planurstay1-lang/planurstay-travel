<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel — PlanurStay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/ps.css">
</head>
<body>
  <main class="container" id="page">
    <div class="crumbs" id="crumbs"></div>
    <div id="top">
      <div class="skel" style="height:34px;width:45%;margin:10px 0 18px"></div>
      <div class="skel" style="height:428px;border-radius:26px"></div>
    </div>
    <div id="roomsWrap"></div>
    <div class="hd-layout">
      <div id="mainCol"></div>
      <aside class="sticky-book" id="bookCol"></aside>
    </div>
  </main>

  <script src="/js/ps.js"></script>
  <script>
  (async function () {
    PS.header({ active: "stays" });
    const hotelId = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
    const q = PS.qs();
    const today = PS.today();
    let checkin = PS.parse(q.checkin), checkout = PS.parse(q.checkout);
    if (!checkin || checkin < today) { checkin = PS.addDays(today, 14); checkout = PS.addDays(checkin, 3); }
    if (!checkout || checkout <= checkin) checkout = PS.addDays(checkin, 1);
    const occ = { adults: +q.adults || 2, rooms: +q.rooms || 1, childAges: q.children ? q.children.split(",").filter(s => s !== "").map(Number) : [] };

    const crumbs = document.getElementById("crumbs");
    const backUrl = q.placeId ? PS.url("/hotels", { placeId: q.placeId, dest: q.dest, destDetail: q.destDetail, checkin: PS.iso(checkin), checkout: PS.iso(checkout), adults: occ.adults, rooms: occ.rooms, children: occ.childAges.join(",") }) : "/hotels";
    crumbs.innerHTML = `<a href="/">Home</a>${PS.icon("right", 14)}<a href="${backUrl}">${PS.esc(q.dest ? "Stays in " + q.dest : "Hotels")}</a>${PS.icon("right", 14)}<span id="crumbName">Hotel</span>`;

    // Allow only simple formatting tags from the supplier description.
    function cleanHTML(html) {
      const tpl = document.createElement("template"); tpl.innerHTML = html || "";
      const ok = new Set(["P", "BR", "STRONG", "B", "EM", "I", "UL", "OL", "LI"]);
      tpl.content.querySelectorAll("*").forEach(n => {
        if (!ok.has(n.tagName)) { n.replaceWith(...n.childNodes); return; }
        [...n.attributes].forEach(a => n.removeAttribute(a.name));
      });
      return tpl.innerHTML;
    }

    let hotel;
    try {
      const r = await PS.api(`/api/hotels/${encodeURIComponent(hotelId)}`);
      hotel = r.data || r;
      if (!hotel || !hotel.name) throw new Error("Hotel not found");
    } catch (e) {
      document.getElementById("top").innerHTML = `<div class="empty" style="margin-top:20px"><div class="ei">${PS.icon("bed", 28)}</div><h3>We couldn't find this hotel</h3><p>${PS.esc(e.message)}</p><a class="btn btn-primary" href="${backUrl}">Back to results</a></div>`;
      document.querySelector(".hd-layout").remove();
      return;
    }
    document.title = `${hotel.name} — PlanurStay`;
    document.getElementById("crumbName").textContent = hotel.name;

    const images = (hotel.hotelImages || []).map(i => i.urlHd || i.url).filter(Boolean);
    if (!images.length && hotel.main_photo) images.push(hotel.main_photo);
    const rating = +hotel.rating || 0;

    // Main photo plays like a slow film: gentle zoom/pan, cross-fading through photos not shown in the side tiles
    const cineIdx = [0, ...images.map((_, k) => k).slice(5, 9)];
    if (cineIdx.length < 3) cineIdx.push(...images.map((_, k) => k).slice(1, 4));
    document.getElementById("top").innerHTML = `
      <div class="hd-head">
        <div>
          <div class="stars">${PS.stars(hotel.starRating)}</div>
          <h1>${PS.esc(hotel.name)}</h1>
          <div class="addr" style="font-size:14.5px;margin-top:8px">${PS.icon("pin", 16)}${PS.esc([hotel.address, hotel.city, hotel.zip].filter(Boolean).join(", "))}${hotel.location?.latitude ? ` · <a class="link" href="#locPanel">View on map</a>` : ""}</div>
        </div>
        ${rating ? `<div class="rating-row" style="margin:0"><span class="score ${rating >= 8.5 ? "great" : ""}" style="min-width:48px;height:38px;font-size:17px">${rating.toFixed(1)}</span><div><b style="display:block">${PS.ratingWord(rating)}</b><small>${(hotel.reviewCount || 0).toLocaleString()} reviews</small></div></div>` : ""}
      </div>
      <div class="gallery">
        ${images.slice(0, 5).map((src, i) => i === 0
          ? `<button data-i="0" class="cine" aria-label="Open photos">${cineIdx.map((k, j) => `<img src="${PS.esc(images[k])}" alt="" data-k="${k}" class="${j === 0 ? "on" : ""}" ${j ? 'decoding="async"' : 'fetchpriority="high"'}>`).join("")}</button>`
          : `<button data-i="${i}" aria-label="Open photo ${i + 1}"><img src="${PS.esc(src)}" alt="" loading="lazy"></button>`).join("")}
        ${images.length > 5 ? `<button class="btn btn-white btn-sm all-photos" data-i="0">${PS.icon("photo", 16)}All ${images.length} photos</button>` : ""}
      </div>`;
    document.querySelectorAll(".gallery [data-i]").forEach(b => b.onclick = () => lightbox(b.classList.contains("cine") ? +(b.querySelector("img.on")?.dataset.k || 0) : +b.dataset.i));
    (() => {
      const cine = document.querySelector(".gallery .cine");
      const layers = cine ? [...cine.querySelectorAll("img")] : [];
      if (layers.length < 2 || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      let cur = 0;
      setInterval(() => {
        if (document.hidden) return;
        const next = (cur + 1) % layers.length;
        if (!layers[next].complete) return; // wait until the next photo has loaded
        layers[cur].classList.remove("on"); layers[next].classList.add("on"); cur = next;
      }, 6500);
    })();

    function lightbox(i) {
      const lb = document.createElement("div"); lb.className = "lightbox";
      const paint = () => lb.innerHTML = `
        <div class="lb-top"><b>${i + 1} / ${images.length}</b><button class="lb-btn" data-x aria-label="Close">${PS.icon("x", 22)}</button></div>
        <div class="lb-stage"><button class="lb-btn" data-p aria-label="Previous">${PS.icon("left", 22)}</button><img src="${PS.esc(images[i])}" alt=""><button class="lb-btn" data-n aria-label="Next">${PS.icon("right", 22)}</button></div>`;
      const go = (d) => { i = (i + d + images.length) % images.length; paint(); bind(); };
      const close = () => { lb.remove(); document.removeEventListener("keydown", key); };
      const key = (e) => { if (e.key === "Escape") close(); if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); };
      const bind = () => { lb.querySelector("[data-x]").onclick = close; lb.querySelector("[data-p]").onclick = () => go(-1); lb.querySelector("[data-n]").onclick = () => go(1); };
      paint(); bind(); document.body.appendChild(lb); document.addEventListener("keydown", key);
      lb.addEventListener("click", (e) => { if (e.target === lb || e.target.classList.contains("lb-stage")) close(); });
    }

    // ─── Main column ───
    const facilities = hotel.hotelFacilities || (hotel.facilities || []).map(f => f.name);
    const sa = hotel.sentiment_analysis || {};
    const times = hotel.checkinCheckoutTimes || {};
    const roomsById = new Map((hotel.rooms || []).map(r => [r.id, r]));
    document.getElementById("mainCol").innerHTML = `

      ${hotel.location?.latitude ? `<section class="panel" id="wxPanel"></section>` : ""}
      <section class="panel"><h2>About this property</h2><div class="hd-desc clamped" id="desc">${cleanHTML(hotel.hotelDescription) || "<p>No description available.</p>"}</div><button class="link" id="descMore" style="background:none;border:0;padding:0;margin-top:8px">Read more</button></section>
      ${facilities.length ? `<section class="panel"><h2>Popular amenities</h2><div class="amen-grid">${facilities.slice(0, 24).map(f => `<div class="amen">${PS.icon("check", 16, 2.6)}${PS.esc(f)}</div>`).join("")}</div></section>` : ""}
      ${rating ? `<section class="panel"><h2>Guest reviews</h2>
        <div class="review-summary"><span class="score ${rating >= 8.5 ? "great" : ""}">${rating.toFixed(1)}</span><div><b style="font-size:20px;color:var(--ink)">${PS.ratingWord(rating)}</b><div style="color:var(--text-2)">Based on ${(hotel.reviewCount || 0).toLocaleString()} verified reviews</div></div></div>
        ${(sa.categories || []).length ? `<div class="cat-bars">${sa.categories.slice(0, 8).map(c => `<div class="cat-bar"><small><span>${PS.esc(c.name)}</span><span>${(+c.rating).toFixed(1)}</span></small><div class="track"><i style="width:${Math.min(100, c.rating * 10)}%"></i></div></div>`).join("")}</div>` : ""}
        ${(sa.pros || sa.cons) ? `<div class="pros-cons">
          ${(sa.pros || []).length ? `<div><b style="color:var(--green)">Guests liked</b><ul>${sa.pros.map(p => `<li>👍 ${PS.esc(p)}</li>`).join("")}</ul></div>` : ""}
          ${(sa.cons || []).length ? `<div><b style="color:var(--text-2)">Could be better</b><ul>${sa.cons.map(p => `<li>👎 ${PS.esc(p)}</li>`).join("")}</ul></div>` : ""}
        </div>` : ""}
      </section>` : ""}
      ${hotel.location?.latitude ? `<section class="panel" id="locPanel"><h2>Location</h2>
        <div class="addr" style="font-size:14.5px">${PS.icon("pin", 16)}${PS.esc([hotel.address, hotel.city, hotel.zip].filter(Boolean).join(", "))}</div>
        <div id="hdMap" style="height:340px;border-radius:14px;overflow:hidden;margin-top:14px;background:var(--line-2)"></div>
        <a class="link" style="display:inline-block;margin-top:10px" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${hotel.location.latitude},${hotel.location.longitude}">Open in Google Maps</a>
      </section>` : ""}
      <section class="panel"><h2>Good to know</h2>
        <div class="info-list">
          ${times.checkin_start ? `<div>${PS.icon("clock", 18)}<div><b>Check-in</b><br><span style="color:var(--text-2)">From ${PS.esc(times.checkin_start)}${times.checkin_end ? " until " + PS.esc(times.checkin_end) : ""}</span></div></div>` : ""}
          ${times.checkout ? `<div>${PS.icon("clock", 18)}<div><b>Check-out</b><br><span style="color:var(--text-2)">Until ${PS.esc(times.checkout)}</span></div></div>` : ""}
          ${hotel.hotelImportantInformation ? `<div>${PS.icon("info", 18)}<div><b>Important information</b><br><span style="color:var(--text-2)">${PS.esc(hotel.hotelImportantInformation)}</span></div></div>` : ""}
        </div>
      </section>`;
    document.getElementById("roomsWrap").innerHTML = `
      <section id="roomsPanel" class="rooms-sec">
        <div class="rooms-head">
          <h2>Choose your room</h2>
          <div class="rooms-ctrl">
            <div class="sfield clickable" id="dDates"><div class="sfield-body"><span class="lbl">Dates</span><span class="val"></span></div></div>
            <div class="stepbox"><span class="lbl">Guests</span><div class="stepper"><button type="button" data-occ="adults" data-d="-1" aria-label="Fewer guests">−</button><output id="oAdults"></output><button type="button" data-occ="adults" data-d="1" aria-label="More guests">+</button></div></div>
            <div class="stepbox"><span class="lbl">Rooms</span><div class="stepper"><button type="button" data-occ="rooms" data-d="-1" aria-label="Fewer rooms">−</button><output id="oRooms"></output><button type="button" data-occ="rooms" data-d="1" aria-label="More rooms">+</button></div></div>
          </div>
        </div>
        <div class="pill-row" id="roomFilters"></div>
        <div id="rooms"></div>
      </section>`;
    const desc = document.getElementById("desc"), more = document.getElementById("descMore");
    if (desc.scrollHeight <= 190) more.remove();
    more && (more.onclick = () => { desc.classList.toggle("clamped"); more.textContent = desc.classList.contains("clamped") ? "Read more" : "Show less"; });

    // ─── Weather during the stay ───
    const loadWeather = () => {
      const el = document.getElementById("wxPanel"); if (!el) return;
      PS.weather(el, { lat: hotel.location.latitude, lng: hotel.location.longitude, start: PS.iso(checkin), end: PS.iso(PS.addDays(checkout, -1) < checkin ? checkin : PS.addDays(checkout, -1)), title: `Weather in ${hotel.city || "the area"} during your stay` })
        .then(() => { if (!el.innerHTML) el.remove(); });
    };
    loadWeather();

    // ─── Location map (loads when scrolled into view) ───
    const mapEl = document.getElementById("hdMap");
    if (mapEl) {
      const io = new IntersectionObserver(async (entries) => {
        if (!entries.some(e => e.isIntersecting)) return;
        io.disconnect();
        try { await PS.leaflet(); } catch { mapEl.innerHTML = `<div class="ac-empty">Map unavailable</div>`; return; }
        const ll = [hotel.location.latitude, hotel.location.longitude];
        const m = L.map(mapEl, { scrollWheelZoom: false }).setView(ll, 15);
        PS.mapTiles(m);
        L.marker(ll, { icon: L.divIcon({ className: "", html: `<span class="map-price hl">${PS.esc(hotel.name.length > 32 ? hotel.name.slice(0, 30) + "…" : hotel.name)}</span>`, iconSize: null }) }).addTo(m);
      }, { rootMargin: "200px" });
      io.observe(mapEl);
    }

    // ─── Booking column ───
    const bookCol = document.getElementById("bookCol");
    function paintBookBox(from) {
      const n = PS.nights(PS.iso(checkin), PS.iso(checkout));
      bookCol.innerHTML = `<div class="panel book-box">
        ${from ? `<div class="from">From</div><div class="price-big">${PS.money(from.total / n, from.currency, 0)}<span style="font-size:15px;font-weight:600;color:var(--text-2)"> /night</span></div><div class="price-sub">${PS.money(from.total, from.currency, 0)} total for ${PS.plural(n, "night")}</div>`
               : `<div class="from">Live prices</div><div class="price-big" style="font-size:22px">Select dates to see prices</div>`}
        <div class="book-summary">
          <div><span>Check-in</span><b>${PS.fmtDay(checkin)}</b></div>
          <div><span>Check-out</span><b>${PS.fmtDay(checkout)}</b></div>
          <div><span>Guests</span><b>${PS.plural(occ.adults + occ.childAges.length, "guest")}, ${PS.plural(occ.rooms, "room")}</b></div>
        </div>
        <a href="#roomsPanel" class="btn btn-primary btn-block btn-lg">Choose a room</a>
        <div class="secure-note">${PS.icon("lock", 14)}Your card isn't charged until you confirm</div>
      </div>
      <div id="memberNudge"></div>`;
      PS.auth().then(a => {
        if (!a.loggedIn) document.getElementById("memberNudge").innerHTML = `<div class="alert info" style="margin-top:14px">${PS.icon("tag", 18)}<div><b>Members see lower prices.</b> <a class="link" href="${PS.loginUrl()}">Sign in or join free</a> to unlock member prices (about 8% off) on this hotel.</div></div>`;
      });
    }
    paintBookBox(null);

    // Date / guest controls re-query rooms
    let reloadT;
    const reload = () => { clearTimeout(reloadT); reloadT = setTimeout(() => { loadRooms(); loadWeather(); }, 250); };
    PS.datePicker(document.getElementById("dDates"), { start: checkin, end: checkout, onChange: (s, e) => { if (s && e) { checkin = s; checkout = e; syncUrl(); reload(); } } });
    const paintOcc = () => { document.getElementById("oAdults").textContent = occ.adults + occ.childAges.length; document.getElementById("oRooms").textContent = occ.rooms;
      document.querySelectorAll("[data-occ]").forEach(b => { const k = b.dataset.occ, d = +b.dataset.d;
        b.disabled = k === "adults" ? (d < 0 ? occ.adults <= occ.rooms : occ.adults >= 16) : (d < 0 ? occ.rooms <= 1 : occ.rooms >= 9); }); };
    document.querySelectorAll("[data-occ]").forEach(b => b.onclick = () => {
      const k = b.dataset.occ, d = +b.dataset.d;
      occ[k] += d;
      if (k === "rooms" && occ.adults < occ.rooms) occ.adults = occ.rooms; // at least one adult per room
      paintOcc(); syncUrl(); reload();
    });
    paintOcc();
    function syncUrl() {
      history.replaceState(null, "", PS.url(location.pathname, { ...q, checkin: PS.iso(checkin), checkout: PS.iso(checkout), adults: occ.adults, rooms: occ.rooms, children: occ.childAges.join(",") }));
    }

    const roomsEl = document.getElementById("rooms");
    let loadSeq = 0;
    async function loadRooms() {
      const my = ++loadSeq;
      roomsEl.innerHTML = `<div class="loading-note" style="margin:0 0 14px"><span class="spinner"></span>Checking live availability…</div>` + Array.from({ length: 2 }, () => `<div class="skel" style="height:160px;border-radius:18px;margin-bottom:14px"></div>`).join("");
      let offers = [];
      try {
        const r = await PS.api("/api/stays/rooms", { method: "POST", body: { currency: PS.cur(), hotelId, checkin: PS.iso(checkin), checkout: PS.iso(checkout), adults: occ.adults, rooms: occ.rooms, childAges: occ.childAges } });
        offers = r.data || [];
        roomPricing = r.pricing || {};
      } catch (e) {
        if (my !== loadSeq) return;
        roomsEl.innerHTML = `<div class="alert error">${PS.icon("alert", 18)}<div>${PS.esc(e.message)} <button class="link" style="background:none;border:0" onclick="location.reload()">Try again</button></div></div>`;
        return;
      }
      if (my !== loadSeq) return;
      allOffers = offers;
      paintBookBox(offers.find(o => !o.memberOnly) || null);
      paintRoomFilters();
      if (!offers.length) {
        roomsEl.innerHTML = `<div class="empty" style="padding:36px 20px"><div class="ei">${PS.icon("cal", 26)}</div><h3>No rooms left for these dates</h3><p>Try different dates or fewer guests. Popular hotels sell out fast.</p></div>`;
        return;
      }
      renderRooms();
    }

    // ─── Room filters ───
    let allOffers = [], roomPricing = {};
    const rf = { refund: false, breakfast: false, sleeps3: false, sort: "low" };
    const hasBreakfast = (o) => /breakfast|half board|full board|all inclusive/i.test(o.board || "");
    function paintRoomFilters() {
      const bar = document.getElementById("roomFilters");
      if (!allOffers.length) { bar.innerHTML = ""; return; }
      const c = (f) => allOffers.filter(f).length;
      const chip = (k, label, n) => `<button class="pill ${rf[k] ? "active" : ""}" data-rf="${k}" ${n ? "" : "disabled style=\"opacity:.45\""}>${label} <span style="opacity:.7">(${n})</span></button>`;
      bar.innerHTML = `
        ${chip("refund", "Free cancellation", c(o => o.refundable))}
        ${chip("breakfast", "Breakfast included", c(hasBreakfast))}
        ${chip("sleeps3", "Sleeps 3+", c(o => (o.maxOccupancy || 0) >= 3))}
        <select class="select" id="roomSort" style="margin-left:auto" aria-label="Sort rooms"><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select>`;
      bar.querySelector("#roomSort").value = rf.sort;
      bar.querySelectorAll("[data-rf]").forEach(b => b.onclick = () => { rf[b.dataset.rf] = !rf[b.dataset.rf]; paintRoomFilters(); renderRooms(); });
      bar.querySelector("#roomSort").onchange = (e) => { rf.sort = e.target.value; renderRooms(); };
    }
    // ─── Rooms: grouped by room type; pick an option, then one Reserve per room ───
    const feeTotal = (o) => (o.taxesExcluded || []).reduce((s, t) => s + (t.amount || 0), 0);
    const cancelLine = (o) => {
      if (!o.refundable) return `<li class="no">${PS.icon("x", 14, 2.6)}Non-refundable</li>`;
      const first = (o.cancelPolicy || []).find(c => c.amount > 0) || (o.cancelPolicy || [])[0];
      return `<li class="ok">${PS.icon("check", 14, 2.6)}Free cancellation${first ? ` until ${PS.deadline(first.from, first.tz)}` : ""}</li>`;
    };
    const optTitle = (o) => hasBreakfast(o) ? PS.esc(o.board) : "Room only";
    const feesBlock = (o, n) => {
      const fees = PS.hotelFees(o, n);
      if (!fees.length) return `<div class="fee-ok">${PS.icon("check", 14, 2.6)}No extra fees at the hotel</div>`;
      return `<div class="fee-box"><b>${PS.icon("info", 14)}Also due at the hotel</b>
        ${fees.map(f => `<div><span>${PS.esc(f.description)}</span><span>${PS.money(f.amount, f.currency || o.currency, 2)}${f.perNight ? `<small>≈ ${PS.money(f.perNight, f.currency || o.currency, 0)}/night</small>` : f.unit ? `<small>${f.unit}</small>` : `<small>for your stay</small>`}</span></div>`).join("")}
        <em>Paid directly to the hotel at check-in or check-out. Not included in today's price.</em></div>`;
    };
    function roomDetails(rm, opts, photos) {
      const back = document.createElement("div");
      back.className = "modal-back";
      const amen = (rm.roomAmenities || []).map(a => a.name).filter(Boolean);
      const beds = (rm.bedTypes || []).map(b => `${b.quantity} ${b.bedType}${b.bedSize ? ` (${b.bedSize})` : ""}`).join(", ");
      const notes = [...new Set(opts.map(o => (o.remarks || "").replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "").trim()).filter(Boolean))][0] || "";
      back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Room details" style="width:min(820px,100%)">
        <div class="modal-head"><h2>${PS.esc(rm.roomName || opts[0].name)}</h2><button class="modal-close" aria-label="Close">${PS.icon("x", 20)}</button></div>
        <div class="modal-body">
          ${photos.length ? `<div class="rd-photos">${photos.slice(0, 8).map(u => `<img src="${PS.esc(u)}" alt="" loading="lazy">`).join("")}</div>` : ""}
          <div class="room-meta" style="font-size:14.5px;margin:14px 0">
            ${rm.roomSizeSquare ? `<span>${PS.icon("sqm", 16)}${rm.roomSizeSquare} ${PS.esc(rm.roomSizeUnit || "m²")}</span>` : ""}
            ${beds ? `<span>${PS.icon("bed", 16)}${PS.esc(beds)}</span>` : ""}
            ${rm.maxOccupancy || opts[0].maxOccupancy ? `<span>${PS.icon("users", 16)}Sleeps ${rm.maxOccupancy || opts[0].maxOccupancy}</span>` : ""}
            ${(rm.views || []).length ? `<span>${PS.icon("photo", 16)}${PS.esc(rm.views.map(v => v.view || v.name || v).join(", "))}</span>` : ""}
          </div>
          ${rm.description ? `<p style="color:var(--text-2);margin-bottom:16px">${PS.esc(String(rm.description).replace(/<[^>]+>/g, " "))}</p>` : ""}
          ${amen.length ? `<h3 style="font-size:16px;margin-bottom:10px">Room amenities</h3><div class="amen-grid" style="margin-bottom:18px">${amen.map(a => `<div class="amen">${PS.icon("check", 15, 2.6)}${PS.esc(a)}</div>`).join("")}</div>` : ""}
          ${notes ? `<h3 style="font-size:16px;margin-bottom:8px">Good to know</h3><p style="color:var(--text-2);white-space:pre-line;font-size:14px">${PS.esc(notes)}</p>` : ""}
        </div></div>`;
      const close = () => { back.remove(); document.body.style.overflow = ""; };
      back.addEventListener("click", (e) => { if (e.target === back) close(); });
      back.querySelector(".modal-close").onclick = close;
      document.body.appendChild(back); document.body.style.overflow = "hidden";
    }

    function renderRooms() {
      const offers = allOffers.filter(o => (!rf.refund || o.refundable) && (!rf.breakfast || hasBreakfast(o)) && (!rf.sleeps3 || (o.maxOccupancy || 0) >= 3));
      if (!offers.length) {
        roomsEl.innerHTML = `<div class="empty" style="padding:30px 20px"><div class="ei">${PS.icon("filter", 26)}</div><h3>No rooms match these filters</h3><p>Try removing a filter. ${allOffers.length} room option${allOffers.length === 1 ? " is" : "s are"} available for your dates.</p></div>`;
        return;
      }
      const n = PS.nights(PS.iso(checkin), PS.iso(checkout));
      const R = occ.rooms;
      const groups = new Map();
      offers.forEach(o => {
        const rm = roomsById.get(o.mappedRoomId) || {};
        const key = o.mappedRoomId || (rm.roomName || o.name).toLowerCase();
        if (!groups.has(key)) groups.set(key, { rm, opts: [] });
        groups.get(key).opts.push(o);
      });
      // Options that look the same to a guest (same cancellation deadline, meal plan and perks) → keep only the cheapest
      const sameKey = (o) => {
        const first = (o.cancelPolicy || []).find(c => c.amount > 0) || (o.cancelPolicy || [])[0];
        return [o.refundable, o.refundable && first ? String(first.from).slice(0, 10) : "", hasBreakfast(o) ? (o.board || "").toLowerCase() : "", (o.perks || []).join("|")].join("~");
      };
      const dedupe = (opts) => { const seen = new Set(); return opts.filter(o => { const k = sameKey(o); if (seen.has(k)) return false; seen.add(k); return true; }); };
      const list = [...groups.values()].map(g => { const opts = dedupe(g.opts.sort((a, b) => a.total - b.total)); return { ...g, opts, min: opts[0].total, pick: 0 }; })
        .sort((a, b) => rf.sort === "high" ? b.min - a.min : a.min - b.min);

      const optLabel = (o) => {
        const first = (o.cancelPolicy || []).find(c => c.amount > 0) || (o.cancelPolicy || [])[0];
        const canc = o.refundable ? `Free cancellation${first ? ` until ${PS.deadline(first.from, first.tz).replace(/,? \d{1,2}:\d{2}.*$/, "")}` : ""}` : "Non-refundable";
        return { canc, meal: hasBreakfast(o) ? PS.esc(o.board) : "" };
      };
      const footHTML = (g) => {
        const o = g.opts[g.pick];
        if (o.memberOnly) return `<div class="rc-price"><span class="tag green">${PS.icon("tag", 13)}Member price</span><small>Sign in to see this price and book it</small></div>
          <a class="btn btn-primary" href="${PS.loginUrl()}">Sign in</a>`;
        return `<div class="rc-price">${o.memberPrice ? `<span class="tag green" style="justify-self:start;margin-bottom:2px">${PS.icon("tag", 12)}Member price</span>` : ""}
            ${o.strikeTotal ? `<s>${PS.money(o.strikeTotal, o.currency, 0)}</s>` : ""}<b>${PS.money(o.total, o.currency, 0)}</b>
            <small>${PS.money(o.total / n / R, o.currency, 0)} per room/night · total for ${R > 1 ? PS.plural(R, "room") + ", " : ""}${PS.plural(n, "night")}</small>
            ${!roomPricing.member && roomPricing.memberFactor ? `<small class="member-nudge"><a href="${PS.loginUrl()}">Lower member price · sign in</a></small>` : ""}
          </div>
          <button class="btn btn-coral" data-reserve>Reserve</button>`;
      };

      roomsEl.innerHTML = `<div class="rgrid">${list.map((g, gi) => {
        const rm = g.rm, o0 = g.opts[0];
        const photos = (rm.photos || []).map(p => p.hd_url || p.url).filter(Boolean);
        const bed = (rm.bedTypes || []).map(b => `${b.quantity} ${b.bedType}`)[0];
        const facts = [o0.maxOccupancy ? `Sleeps ${o0.maxOccupancy}` : "", bed || ""].filter(Boolean).join(" · ");
        return `<article class="rcard" data-g="${gi}">
          <button type="button" class="rc-img" data-rd="${gi}" aria-label="Room photos and details">
            ${photos[0] ? `<img src="${PS.esc(photos[0])}" alt="" loading="lazy" onerror="this.remove()">` : (images[gi + 1] ? `<img src="${PS.esc(images[gi + 1])}" alt="" loading="lazy">` : "")}
            ${photos.length > 1 ? `<span class="rg-count">${PS.icon("photo", 13)}${photos.length}</span>` : ""}
          </button>
          <div class="rc-body">
            <h3>${PS.esc(rm.roomName || o0.name)}</h3>
            ${facts ? `<p class="rc-facts">${PS.esc(facts)}</p>` : ""}
            <button type="button" class="rc-more" data-rd="${gi}">More details ${PS.icon("right", 13)}</button>
            <div class="rc-opts" role="radiogroup" aria-label="Options">
              ${g.opts.map((o, k) => { const L = optLabel(o); return `
                <label class="rc-opt ${k === g.pick ? "on" : ""} ${g.opts.length === 1 ? "single" : ""}">
                  ${g.opts.length > 1 ? `<input type="radio" name="rc${gi}" value="${k}" ${k === g.pick ? "checked" : ""}>` : ""}
                  <span class="rc-o"><span class="${o.refundable ? "ok" : ""}">${L.canc}</span>${L.meal ? `<small>${L.meal}</small>` : ""}</span>
                  ${g.opts.length > 1 ? `<span class="rc-d">${k === 0 ? "" : "+" + PS.money(o.total - g.opts[0].total, o.currency, 0)}</span>` : ""}
                </label>`; }).join("")}
            </div>
            <div class="rc-foot">${footHTML(g)}</div>
          </div>
        </article>`;
      }).join("")}</div>`;

      const bind = (el, g) => el.querySelector("[data-reserve]").onclick = () => reserve(g.opts[g.pick], g.rm);
      roomsEl.querySelectorAll(".rcard").forEach(el => {
        const g = list[+el.dataset.g];
        bind(el, g);
        el.querySelectorAll('input[type="radio"]').forEach(r => r.onchange = () => {
          g.pick = +r.value;
          el.querySelectorAll(".rc-opt").forEach((c, k) => c.classList.toggle("on", k === g.pick));
          el.querySelector(".rc-foot").innerHTML = footHTML(g); bind(el, g);
        });
      });
      roomsEl.querySelectorAll("[data-rd]").forEach(b => b.onclick = () => {
        const g = list[+b.dataset.rd];
        roomDetails(g.rm, g.opts, (g.rm.photos || []).map(p => p.hd_url || p.url).filter(Boolean));
      });
      function reserve(o, rm) {
        PS.store.set("ps_hotel_sel", {
          hotel: { id: hotelId, name: hotel.name, photo: images[0] || hotel.main_photo, address: [hotel.address, hotel.city].filter(Boolean).join(", "), city: hotel.city, country: String(hotel.country || "").toUpperCase(), stars: hotel.starRating, rating, info: hotel.hotelImportantInformation || "", times: hotel.checkinCheckoutTimes || null },
          offer: { ...o, roomName: rm.roomName || o.name },
          stay: { checkin: PS.iso(checkin), checkout: PS.iso(checkout), ...occ },
          back: location.pathname + location.search,
        });
        location.href = PS.url("/checkout", { type: "hotel", hotelId, offerId: o.offerId });
      }
    }
    loadRooms();
  })();
  </script>
</body>
</html>
